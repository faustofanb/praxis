[settings]
lockfile = true

[tools]
bun = "1.3.14"

[tasks.install]
description = "Install exact-pinned workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.format]
run = "bun run format"

[tasks."format:check"]
run = "bun run format:check"

[tasks.lint]
run = "bun run lint"

[tasks.typecheck]
run = "bun run typecheck"

[tasks.test]
run = "bun run test"

[tasks."test:coverage"]
run = "bun run test:coverage"

# These task names are reserved for later milestones; add the matching package
# scripts once the corresponding test suites exist.
# [tasks."test:integration"]
# run = "bun run test:integration"
# [tasks."test:replay"]
# run = "bun run test:replay"
# [tasks."test:fault"]
# run = "bun run test:fault"

[tasks.knip]
run = "bun run knip"

[tasks.check]
depends = ["format:check", "lint", "typecheck", "test", "knip"]

[tasks."check:all"]
depends = ["check", "test:coverage"]
