[tools]
python = "3.12.13"
uv = "0.11.29"
worktrunk = "0.68.0"

[tasks.setup]
description = "Install the locked development environment"
run = "uv sync --extra dev --locked"

[tasks.format]
run = "uv run ruff format ."

[tasks.lint]
run = "uv run ruff check ."

[tasks.typecheck]
run = "uv run ty check"

[tasks.test]
run = "uv run pytest && node --test tests-js/*.test.js"

[tasks.audit]
run = "uv run pip-audit --cache-dir .praxis/cache/pip-audit"

[tasks.verify]
depends = ["lint", "typecheck", "test", "audit"]
