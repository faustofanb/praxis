schema_version = 1

[[command]]
id = "praxis.check"
argv = "task system -- check"
writes = []
outputs = ["structured Praxis consistency report"]
risk = "readonly"
requires_confirmation = false

[[command]]
id = "praxis.profile"
argv = "task system -- praxis-profile"
writes = [".praxis/out/profile.json"]
outputs = ["Praxis core and project adapter profile"]
risk = "state"
requires_confirmation = false

[[command]]
id = "praxis.template-check"
argv = "task system -- template-check"
writes = [".praxis/out/template-report.json"]
outputs = ["Praxis rule and skill template validation report"]
risk = "state"
requires_confirmation = false

[[command]]
id = "praxis.template-render"
