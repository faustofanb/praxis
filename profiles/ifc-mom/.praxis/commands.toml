outputs = ["README.md", "00-原始需求/"]
risk = "state"
requires_confirmation = false

[[command]]
id = "docs.iter"
argv = "task req -- iter <requirement> analysis|plan|progress <topic>"
writes = ["docs/02-req/YYYY-MM/YYYY-MM-DD-<requirement>/01-需求分析拆解/", "docs/02-req/YYYY-MM/YYYY-MM-DD-<requirement>/02-任务规划/", "docs/02-req/YYYY-MM/YYYY-MM-DD-<requirement>/03-开发进度/"]
outputs = ["stage markdown"]
risk = "state"
requires_confirmation = false

[[command]]
id = "docs.check"
argv = "task req -- check <requirement>"
writes = []
outputs = ["docs gate report"]
