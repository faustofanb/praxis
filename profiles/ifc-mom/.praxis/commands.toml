requires_confirmation = false

[[command]]
id = "docs.tolaria-publish"
argv = "task docs -- tolaria-publish <requirement>|--all"
writes = ["docs/types/*.md", "docs/views/*.yml", "docs/02-req/YYYY-MM/YYYY-MM-DD-<requirement>/04-产出物/Tolaria知识索引.md", ".praxis/out/tolaria/tolaria-publish.json"]
outputs = ["Tolaria type docs", "saved views", "requirement knowledge indexes"]
risk = "state"
requires_confirmation = false

[[command]]
id = "context"
argv = "task context -- <project> <requirement>"
