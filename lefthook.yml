pre-commit:
  parallel: true
  jobs:
    - name: biome-staged
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: bun run typecheck
    - name: tests
      run: bun run test
