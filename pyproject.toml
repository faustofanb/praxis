[project]
name = "praxis-next"
version = "0.1.0"
description = "平台无关的 Praxis 执行内核、能力包和薄平台适配器"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
praxis = "praxis.cli:main"
praxis-smoke = "praxis.smoke:main"

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.4",
  "build==1.2.2.post1"
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]
artifacts = ["adapters/**"]

[tool.hatch.build.targets.wheel.force-include]
"src/praxis/resources" = "praxis/resources"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
