[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "praxis-workflow"
version = "3.0.0"
description = "Local-first AI development workflow governance platform"
requires-python = ">=3.13"
dependencies = ["mcp>=1.27,<2"]

[project.scripts]
praxis = "praxis.cli:main"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.135,<7",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.2,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.12,<1",
  "ty>=0.0.1a16,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "praxis/bundled_skills"

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=praxis --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src", "tests"]
