[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "praxis-workflow"
version = "2.0.0"
description = "Clean-room AI workflow and business knowledge kernel"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
praxis = "praxis.cli:main"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.135,<7",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.2,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.12,<1",
  "ty>=0.0.1a16,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=praxis --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src", "tests"]

