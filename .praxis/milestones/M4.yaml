schema_version: 1
id: M4
status: planned
goal: 'Add lightweight epistemic primitives: Observation, Hypothesis, falsifiable
  Plan and Challenge that actually change runtime behavior.'
prerequisites:
- M3
required_deliverables:
- epistemic contracts/events
- plan invalidation
- challenge path
- verification linkage
forbidden_work:
- critic agent
- judge agent
- AI coalition analyzer
machine_gates:
- format
- lint
- typecheck
- unit
- integration
- property
- replay
- fault
- build
scenario_acceptance:
- hypothesis falsification invalidates old plan
- challenge changes next legal action
failure_acceptance:
- challenge cannot be only a log entry
- falsified plan cannot keep executing
human_demo_required: true
real_model_eval: formal eval begins; non-core-gating
acceptance_doc: docs/acceptance/M4.md
promotion_requires_independent_or_human_acceptance: true
