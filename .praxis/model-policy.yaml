schema_version: 1
as_of: 2026-08-27
principle: models_are_workers_not_project_authority
implementation:
  primary:
    model: gpt-5.6-sol
    harness: codex
    default_effort: high
    tier0_effort: max
  independent_review:
    model: claude-opus-5
    harness: claude-code
    effort: xhigh_or_max
  escalation:
    model: claude-fable-5
    harness: claude-code
    use_only_on_evidence: true
cost_speed_candidates:
  - model: gemini-3.7-flash
    intended_scope: low_or_medium_risk_work_after_repo_eval
  - model: deepseek-v4-flash
    intended_scope: cost_sensitive_agent_work_after_repo_eval
acceptance:
  model_opinion_never_overrides_machine_gates: true
  tier0_same_model_self_review_is_not_independent_review: true
  milestone_promotion_is_not_model_authority: true
reevaluation:
  cadence: at_milestone_end_or_at_most_monthly
  require_repo_eval: true
  no_architecture_change_required_for_model_swap: true
