schema_version: 1
id: M1-T004
title: add property replay and store parity test suites
milestone: M1
status: accepted
risk_class: C
objective: "Close the M1 machine-gate matrix: add the replay suite (historical JSON fixture replay plus checkpoint-resumability properties over the EventStore port) and the store parity suite (in-memory vs SQLite EventStore equivalence under property-generated streams), wire the mise test:replay gate, and restore the replay requirement in the event-reducer and store quality rules."
evidence: 
  observed: 
    - "M1.yaml machine gates list replay, but no mise test:replay task or replay suite exists"
    - the event-reducer and store quality rules were trimmed to existing gates with comments promising restoration when these suites land
    - "two EventStore implementations now exist (test in-memory, SQLite adapter) with no equivalence check between them"
  expected: 
    - "ADR-0003 verification: replay of identical events produces identical DerivedState and historical fixtures remain loadable across schema evolution"
    - "docs/02 section 7: derived state is recomputed by folding the event stream; snapshots/checkpoints are an optimization that must not change results"
  references: 
    - docs/02-system-design.md
    - docs/decisions/ADR-0003-event-store.md
    - .praxis/milestones/M1.yaml
hypothesis: "Replay correctness reduces to two checkable laws (checkpoint resumability: folding a suffix from any prefix state equals a single full fold; restart determinism: a persisted stream read twice folds identically) and store parity is expressible as deep equality of readStream output and folded state across both EventStore implementations for property-generated streams."
scope: 
  allowed_paths: 
    - .praxis/tasks/M1-T004.yaml
    - .praxis/state.yaml
    - .praxis/quality-gates.yaml
    - .praxis/handoffs/**
    - tests/**
    - package.json
    - bun.lock
    - mise.toml
    - docs/subsystems/**
  forbidden_paths: 
    - packages/**
    - apps/**
architecture_refs: 
  - docs/02-system-design.md
required_gates: 
  []
acceptance: 
  scenarios: 
    - a committed historical JSON fixture stream parses through the public schema and folds to its recorded terminal state
    - "for any valid stream and any checkpoint k, folding the suffix from the prefix state equals the single full fold"
    - the same random stream appended to the in-memory and SQLite stores reads back identically and folds identically
  failure_cases: 
    - "a fixture written by an older schema version failing to load is a visible test failure, not a runtime surprise"
    - "divergence between the two EventStore implementations (ordering, filtering, event shape) fails the parity property"
    - a checkpoint state that cannot be continued with the remaining suffix fails resumability
  artifacts: 
    - tests/replay/replay.test.ts
    - tests/store/store-parity.bun.test.ts
    - tests/fixtures/replay/session-lifecycle-v1.json
    - .praxis/handoffs/ generated by ai:handoff
falsified_if: "Replay results depend on anything but the event sequence, checkpoints change outcomes, or the two stores disagree on any generated stream."
requires_adr: false
requires_human_acceptance: false