schema_version: 1
id: M7-T010
title: set and enforce the core coverage target
milestone: M7
status: accepted
risk_class: A
objective: "Close the docs/03 M7 quality-gate row 'Core branch/statement coverage target' (M7-T010, risk A, backlog entry added with this contract) — the last untasked M7 row. Observed state: coverage infrastructure already exists (vitest 4.1.11 + @vitest/coverage-v8 4.1.11; vitest.config.ts reporter text/json-summary/html; mise test:coverage in the check:all chain so CI runs it) but NO thresholds are configured — coverage is measured, never enforced, and the M7 row's deliverable (a decided target) has no home. Measured baseline (this session, mise run test:coverage, v8 provider): packages/core aggregate statements 97.58% (847/868), branches 94.31% (497/527) — per-file weak spots are tool-runtime.ts (93.65/87.17) and run-turn.ts (94.11/90.32); the workspace-wide total (84.12/81.93) is dragged down by store-sqlite (vitest-collected ~7% is MEANINGLESS — its 13 tests are bun-only *.bun.test.ts excluded from vitest collection by design; the real store evidence is mise run test:store) — which is why the target is scoped to packages/core, matching the row's own 'Core' wording. Target decision (the row's deliverable): statements >= 95, branches >= 90 for packages/core/src/** — calibrated ~2.6pt/~4.3pt below the measured baseline so natural variance from active development stays legal while real erosion fails CI loudly; this supersedes the pre-measurement 85/75 floated in the previous close-out (85/75 against a 97.6/94.3 baseline would be a no-op floor). Enforcement verified experimentally BEFORE this contract: vitest 4.1.11 coverage.thresholds supports glob-scoped threshold sets under the v8 provider; wired at 95/90 test:coverage exits 0; bumping branches to an impossible 100 with all 59 files/502 tests passing yields exit 1 with exactly 'ERROR: Coverage for branches (94.3%) does not meet \"packages/core/src/**\" threshold (100%)' — the exit code is the enforcement payload (check:all -> test:coverage -> CI quality job). Deliverable: (a) vitest.config.ts — the thresholds block (glob 'packages/core/src/**', statements 95, branches 90) with a comment stating the measured baseline and the enforcement path; (b) docs/03 row ticked with provenance incl. baseline numbers and the honest store-sqlite measurement caveat; (c) .praxis/backlog.yaml M7-T010 entry. No production code, no test additions: the floor is enforced by existing gates on every CI run."
evidence: 
  observed: 
    - "docs/03 M7 row 'Core branch/statement coverage target' unchecked; vitest.config.ts has coverage reporting with zero thresholds; mise check:all already runs test:coverage (CI quality job)"
    - "measured baseline: core aggregate stmts 97.58% (847/868), branch 94.31% (497/527); weakest core files tool-runtime.ts 93.65/87.17, run-turn.ts 94.11/90.32; workspace total 84.12/81.93 distorted by store-sqlite bun-only tests not being vitest-collected"
    - "vitest 4.1.11 types (node_modules/vitest/dist/coverage.d.ts): threshold sets 'either for specific files defined by glob pattern or global for all other files' — both providers"
    - "experiment (clean run): thresholds 'packages/core/src/**' statements 95 / branches 100 => exit 1 with the exact ERROR line, 59 test files 502 tests all passing — failure is purely threshold-driven; at 90 branches => exit 0"
  expected: 
    - "vitest.config.ts: thresholds block as specified (12 added lines, nothing else)"
    - "docs/03-project-plan.md: '- [ ] Core branch/statement coverage target' -> - [x] with (M7-T010: …) provenance — baseline numbers, target rationale, store-sqlite caveat"
    - ".praxis/backlog.yaml: M7-T010 entry (id/order 100/title/prerequisites [M7-T003]/risk A)"
    - mise run test:coverage exit 0 at the implementation commit; every future erosion below 95/90 fails check:all and CI
  references: 
    - vitest.config.ts
    - mise.toml
    - docs/03-project-plan.md
    - packages/core/src/tools/tool-runtime.ts
    - packages/core/src/agent-loop/run-turn.ts
hypothesis: "The decided target (95/90 core-scoped) is both meaningful and already met: enforcement is a 12-line config block verified to bite (exit 1 on violation, exit 0 at baseline), riding the existing check:all/CI chain with zero production or test changes. If the baseline could not have been measured from existing suites, or the threshold mechanism did not bite under the v8 provider, the hypothesis would falsify — neither happened."
scope: 
  allowed_paths: 
    - .praxis/tasks/M7-T010.yaml
    - .praxis/state.yaml
    - .praxis/handoffs/**
    - .praxis/backlog.yaml
    - vitest.config.ts
    - docs/03-project-plan.md
  forbidden_paths: 
    - packages/**
    - apps/**
    - tests/**
    - scripts/**
    - evals/**
    - mise.toml
    - package.json
    - bun.lock
    - tsconfig.json
    - knip.json
    - .github/**
    - .praxis/quality-gates.yaml
    - .praxis/milestones/**
    - docs/02-system-design.md
    - docs/09-dependency-inventory.md
    - docs/10-memory-context-growth.md
    - docs/11-sqlite-corruption-recovery.md
    - docs/subsystems/**
    - docs/acceptance/**
    - docs/decisions/**
    - AGENTS.md
  scope_notes: 
    - "Target value is a DECISION: 95/90 is the implementing AI's calibrated proposal supplanting the pre-measurement 85/75 example; the human can move it by editing two numbers in vitest.config.ts — the mechanism, not the number, is the deliverable"
    - "Threshold scoped to packages/core only: the row says Core; a workspace-wide floor would require first solving the store-sqlite bun-only measurement gap (different task) and adding floors to tool-local/provider/testkit (each already 84-96% but undiscussed) — out of scope, recorded as future work"
    - "store-sqlite's vitest-collected coverage (~7%) is a measurement artifact (bun-only tests excluded from vitest by design, M1/M2 decision) — the docs/03 tick states this so no one mistakes it for a quality signal"
    - "No gate-registry change: enforcement rides check:all -> test:coverage which CI already runs; adding a separate 'coverage' gate id is unnecessary machinery"
    - "No ADR: setting a floor is normal quality-gate operation, not an architecture decision"
architecture_refs: 
  - .praxis/architecture.yaml
  - docs/03-project-plan.md
required_gates: 
  - unit
  - property
  - integration
  - replay
  - build
acceptance: 
  scenarios: 
    - mise run test:coverage exits 0 at the implementation commit with the thresholds block in place (baseline above floor)
    - "the enforcement bites: documented experiment shows exit 1 with the exact threshold ERROR when branches floor is raised to an impossible value while all tests pass"
    - full required_gates green; check:all (CI) now carries the floor
  failure_cases: 
    - a threshold that fails at the current baseline (self-inflicted red CI) — must not happen; verified experimentally
    - "a global (workspace-wide) threshold that store-sqlite's bun-only measurement gap would break"
    - "wiring thresholds without the bite test — an unverified gate is a wish, not a gate"
  artifacts: 
    - vitest.config.ts thresholds block
    - docs/03-project-plan.md M7 row tick
    - .praxis/backlog.yaml M7-T010 entry
falsified_if: "The threshold mechanism cannot be made to bite under the v8 provider with glob scoping (it can and did — exit 1 with the exact ERROR line), or the measured baseline is below the decided floor (it is not: 97.58/94.31 vs 95/90). Also falsified if enforcing the floor requires test or production changes to pass — that would mean the floor is not descriptive of current reality."
requires_adr: false
requires_human_acceptance: false
notes: "Risk A per backlog authoring (12-line config + docs; mechanism experimentally proven to bite; target already met). requires_human_acceptance FALSE (precedent M7-T001 through T009); the target NUMBER is trivially changeable by the human (two values in vitest.config.ts). With this row, ALL ten docs/03 M7 quality-gate rows are ticked and all ten M7 backlog tasks accepted — the milestone is acceptance-ready for the human demo/sign-off; the implementing AI stops short of milestone promotion per the milestone-acceptance skill."