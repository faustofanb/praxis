hypothesis: "The v1 transition tables are complete and machine-checkable: an independent shadow model built only from the documented tables (docs/02 §7/§8.2/§14/§16) agrees with foldSessionEvents on every projected field across arbitrary legal full-vocabulary streams, every precondition violation is rejected with IllegalTransitionError, terminals are absorbing, and folding is resume-invariant at every split point. If the reducer disagrees with the documented tables, that is a Core correctness defect — evidence and a new contract, never an in-scope Core patch."
