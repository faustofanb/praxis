  observed: 
    - ".praxis/backlog.yaml M7-T001 (risk C, prerequisites [M6]) is the first M7 task; docs/03-project-plan.md M7 Quality Gates row 'fast-check state machine suite' is unchecked; M7.yaml machine_gates include property"
    - "tests/property/reducer.property.test.ts + tests/helpers/random-session-streams.ts cover only the six session/turn event types; the in-turn machines (tool lifecycle, model request) and the epistemic machines (hypothesis transition table, plan supersede/invalidate, challenge lifecycle + completion blocking, latest-wins fields) have no property-level coverage — only example-based tests/reducer-{tools,model,epistemic}.test.ts"
    - "packages/core/src/state/reducer.ts is the single transition authority (foldSessionEvents/reduceSession exported from @praxis/core); packages/testkit/src/session-events.ts provides factories for the full vocabulary with stable numeric id schemes (tool-exec-N, hyp-N, plan-N, challenge-N, obs-N, turn-N) usable with small bounded id spaces to force id-collision paths"
    - no property pins fold-resume equivalence (checkpoint algebra) or precondition-violation rejection (existing perturbation properties cover only seq corruption and adjacent swaps)
  expected: 
    - "tests/helpers/full-vocabulary-machine.ts (new): command union over the full vocabulary with bounded numeric ids (collisions exercised), shadow model of the documented tables, translateFullCommands() → legal streams, machineProjection() → expected derived-state summary, illegalEventCandidates() → schema-valid events violating exactly one precondition at the current state"
    - "tests/property/state-machine.property.test.ts (new, ~6 tests): model agreement (a), generator schema-validity (b), prefix invariants (c), fold-resume equivalence (d), precondition-violation rejection (e), absorbing terminals (f)"
    - "docs/03-project-plan.md: tick '- [ ] fast-check state machine suite' → - [x] with (M7-T001: ...) provenance"
    - "docs/subsystems/core.md: one test-entry line for the state-machine property suite (the reducer owns the laws under test)"
    - "NO changes under packages/**, apps/**, scripts/** — test-only hardening; a genuine model/reducer disagreement caused by a REDUCER defect STOPS the task per falsified_if (the fix needs its own contract; a MODEL bug is fixable in-scope since the model is the test instrument)"
  references: 
