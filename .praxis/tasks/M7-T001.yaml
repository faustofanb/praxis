acceptance: 
  scenarios: 
    - "arbitrary legal full-vocabulary streams: foldSessionEvents agrees with the independent shadow model on status, open turn, turn registry, pending model request, tool snapshots (status/result/reconciliationCount), goal, observations, hypothesis statuses, plan statuses + active plan, challenge statuses + open list, last verification"
    - "fold-resume equivalence: fold(prefix) then reduceSession over the suffix equals fold(full stream) at every split point"
    - "prefix structural invariants: headSeq === count, openChallenges exactly the open challenges, activePlan unique active plan"
  failure_cases: 
    - "a legal machine stream failing to fold, or folding to a state that disagrees with the model on any projected field"
    - a precondition-violating append being ACCEPTED by the reducer (wrong direction — silently corrupting state)
    - "a terminal status (falsified/superseded hypothesis, terminal tool execution) being movable by any repertoire event"
    - fold(prefix)+suffix diverging from fold(all)
    - the machine emitting an event that fails SessionEventUnionSchema (generator drift)
  artifacts: 
    - tests/helpers/full-vocabulary-machine.ts
    - tests/property/state-machine.property.test.ts
    - docs/03-project-plan.md M7 row tick
    - docs/subsystems/core.md test entry
falsified_if: "Any property in the suite fails BECAUSE OF REDUCER BEHAVIOR (a legal documented stream rejected, an illegal append accepted, a terminal moved, resume-divergence): that is a Core correctness defect — stop, record evidence, open a new contract (any packages/core fix needs its own task and gates; event/schema changes would additionally trigger ADR). Failures caused by the model itself are instrument bugs fixed in-scope. Weakening or duplicating existing property/example suites instead of adding the machine also falsifies the contract."
requires_adr: false
requires_human_acceptance: false
notes: "Risk C per backlog (the suite encodes the Core transition laws, but ships zero production code). requires_human_acceptance FALSE (precedent M6-T002/T003 for mid-milestone tasks): the deliverable IS a machine-verifiable test suite — the property gate passing is the acceptance evidence; M7 milestone promotion remains human-gated regardless (promotion_requires_independent_or_human_acceptance), and the follow-up M7-T002 (risk D) is human-gated by risk class. The M7 rows NOT in this task: coverage target, fault/security suites (M7-T002), soak, knip, memory report — untouched."