objective: "Close the first M7 task row (.praxis/backlog.yaml M7-T001, prerequisites [M6] — accepted 2026-08-30) and the docs/03 M7 quality-gate row 'fast-check state machine suite'. Observed state: tests/property/ pins schema round-trips for the FULL vocabulary (contracts-events.property.test.ts, tool-events.property.test.ts), buildContext caps (context-builder.property.test.ts), and a session/turn-level state machine (reducer.property.test.ts over tests/helpers/random-session-streams.ts — six event types: SessionCreated/Resumed/Paused/Completed, TurnStarted/Completed, invariants on status/headSeq/openTurn/usedTurns only). Nothing property-level pins the state machines INSIDE a turn: the docs/02 §8.2 tool lifecycle (PROPOSED→AUTHORIZED→EXECUTING→SUCCEEDED/FAILED/INDETERMINATE, ToolRejected from PROPOSED|AUTHORIZED, reconcile only from INDETERMINATE with attempt counting), the model-request machine (pending set by Started, cleared by ResponseCompleted/RequestFailed, ToolProposed blocked while pending), or the epistemic machines (hypothesis legal-transition table with terminal statuses falsified/superseded absorbing, plan supersede-on-set + invalidate-from-active-only, challenge open→terminal with completion-target blocking SessionCompleted, GoalSet/VerificationRecorded latest-wins) — all are pinned only by example-based unit suites (tests/reducer-*.test.ts). Also unpinned: fold-resume equivalence (fold(prefix) then step-reducing the suffix must equal fold(full stream) — the checkpoint/recovery algebra behind store parity), and rejection of PRECONDITION violations (as opposed to seq/stream perturbations already pinned). Deliverable: (1) tests/helpers/full-vocabulary-machine.ts — an INDEPENDENT shadow model of the documented transition tables (docs/02 §7/§8.2/§14/§16) translating generated command arrays into legal full-vocabulary event streams via the @praxis/testkit session-event factories, tracking expected projections (status, open turn, turn registry, pending model, per-execution tool snapshots incl. reconciliationCount, goal, observations, hypothesis statuses, plan statuses + active plan, challenge statuses + open list, last verification); (2) tests/property/state-machine.property.test.ts — the hardening suite: (a) reducer agrees with the independent model on every projected field for arbitrary legal streams (deep comparison via normalized summaries); (b) every machine-emitted event is schema-valid (SessionEventUnionSchema.parse identity — generator drift guard); (c) at every prefix, structural invariants hold: headSeq === event count, turn registry matches distinct TurnStarted, openChallenges exactly the open-status challenges, activePlan is the unique active-status plan; (d) fold-resume equivalence at arbitrary split points; (e) a precondition-violating append (illegal-event repertoire derived from the machine's current state: pause/complete with open turn or blocking completion challenge, duplicate turn/tool/observation/hypothesis/plan/challenge ids, tool transition from wrong current status, reconcile from non-INDETERMINATE, hypothesis change out of a terminal status, unknown-id references, epistemic event while PAUSED, model request while one is pending) is ALWAYS rejected with IllegalTransitionError; (f) terminal statuses are absorbing — no repertoire command can move a falsified/superseded hypothesis or a terminal tool execution. Tick the docs/03 M7 row with provenance."
