  - unit
  - property
  - integration
  - replay
  - build
acceptance: 
  scenarios: 
    - "five configs re-run at RC HEAD; scorecards registered in BASELINE.md under the release-baseline section with variance notes vs v3"
    - "M8.md Real-model Eval section filled with scorecard links; docs/03 row ticked"
    - "full required_gates green (unchanged code)"
  failure_cases: 
    - "a matrix/instrument change smuggled into the release run (frozen instrument)"
    - "any credential or unredacted gateway URL entering a committed file"
    - "fabricated numbers (every scorecard must exist under results/ and be linked)"
  artifacts: 
    - evals/development-models/BASELINE.md (v1 release baseline section)
    - docs/acceptance/M8.md real-model section
    - docs/03-project-plan.md row tick
falsified_if: "The instrument must change to make the release run passable (matrix frozen at v3), or a config becomes entirely unrunnable (gateway dead) — the latter is recorded as an honest limitation with the failing runs attached, not silently dropped."
requires_adr: false
requires_human_acceptance: false
notes: "Risk B per backlog (real-model measurement over a frozen instrument; machine-acceptable on recorded evidence with scorecards as artifacts). After this: M8-T005 (non-goals/changelog/release checklist, risk A) completes the M8 backlog; milestone human acceptance follows."
