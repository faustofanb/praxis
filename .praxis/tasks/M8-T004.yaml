  scope_notes: 
    - "scenarios/grader/runner are FORBIDDEN: the matrix is frozen at v3 — a release eval that changes the instrument is not a baseline"
    - "n=1 per (model, scenario) per the standing protocol; the release record adds a second time-point for every config, so variance across the two runs is visible — that is a feature of the record, not noise to hide"
    - "Credentials stay in the session: command lines only, never files; scorecard gateway URLs redacted (established pattern)"
    - "No ADR: no decision changes — measurement and registration over a frozen instrument"
