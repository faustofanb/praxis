  scope_notes: 
    - "core/contracts FORBIDDEN: the projection's two-fact honesty is a LAW (docs/02 s12, M3-T001 replay fixture pins checkpoint 'reconciled after indeterminate'), and the port shape is fine — only the adapter's wire rendering needs the merge"
    - "The merge is adapter-boundary wire-law adaptation exactly per docs/02 s10; the model still sees both facts verbatim and in order (array content), satisfying 'after, never instead of' at the message-content level"
    - "risk B not A: wire behavior changes for a shape that previously produced 400s on strict gateways — behavior-changing but strictly from broken-to-valid; gateways that tolerated duplicates accept the merged form (single response per id is the standard shape)"
    - "BASELINE registration of the deepseek xhigh re-run happens after acceptance, as operator evidence"
