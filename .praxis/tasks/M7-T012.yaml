acceptance: 
  scenarios: 
    - "provider unit tests: two same-id consecutive tool facts => one wire message with JSON-array content in event order; distinct ids stay separate; single fact stays bare"
    - "all existing provider unit tests byte-unaffected (zero-change identity for non-duplicate shapes)"
    - "operator diag vs strict gateway: resolved-indeterminate no longer produces HTTP 400 loops; the turn reaches a legal terminal outcome"
    - "required_gates incl. fault+security green (provider rule)"
  failure_cases: 
    - "merging non-adjacent tool messages or different-id messages (parallel calls must stay separate)"
    - "changing the single-fact content shape (would break zero-change identity and existing tests)"
    - "touching core projection or contracts to 'fix' the wire issue (law lives there; the adapter adapts)"
  artifacts: 
    - packages/provider-openai/src/chat-provider.ts (merge in toChatMessages)
    - tests/provider-openai/chat-provider.test.ts (3 new cases)
falsified_if: "Strict-gateway rejection persists after the merge (the bisect says duplicate id is the only trigger for this history), or the merge cannot preserve both facts verbatim and in order — then the wire law needs a different adaptation and the contract re-plans. Also falsified if any existing test breaks (the single-fact identity must hold)."
requires_adr: false
requires_human_acceptance: false
notes: "Risk B: wire behavior changes from broken-to-valid for reconciled histories on strict gateways; machine-acceptable (flags false). Direct operator authorization 2026-08-30 ('有问题就修复'). This was found BY the eval harness doing its job — the diag evidence (captured fetch + curl bisect) is the durable repro."
