schema_version: 1
id: M5-T002
title: implement deterministic compaction and long-session tests
milestone: M5
status: acceptance_ready
risk_class: C
objective: "Close the last M5.1 checkbox 'deterministic summary/简单 compaction strategy' and the M5 scenario acceptance '1000-turn synthetic session stays bounded' (.praxis/milestones/M5.yaml, docs/03 section 8). Today buildContext windows history at maxRecentMessages and drops oldest messages under the token cap, counting them in estimate.droppedMessages — but nothing replaces the dropped prefix: the model silently loses the fact that earlier work existed, and no test proves a long session stays bounded end to end. Deliverable: deterministic compaction — when messages drop out of the context window (either the count window or the token-cap loop), buildContext appends a single structured '## Compacted history' line to the composed system fragment after the epistemic brief, rendering honest per-role counts of everything dropped (user/assistant/tool messages), derived purely from the dropped messages themselves with no clock, randomness, or model-generated prose. Zero dropped messages keeps the composed system fragment byte-identical to today. The existing fail-closed composition law (M5-T001) applies unchanged to prompt+brief+summary. Long-session proof: a 1000-turn synthetic event stream projects, folds, and builds a context that stays within every declared cap while the durable state (goal/plan/verification) still reaches the model via the brief; plus a runTurn integration where a ScriptedModel consumes the bounded request. Conversation projection stays full-fidelity by design — the event store is the history, the context is bounded working state; compaction happens only at context build, never by deleting or rewriting events."
evidence: 
  observed: 
    - "packages/core/src/context/builder.ts: the window slice and token-cap loop drop oldest messages silently; estimate.droppedMessages is reported but no fragment tells the model what was compacted"
    - "packages/core/src/agent-loop/conversation.ts + run-turn.ts:190: history is re-projected from the full durable stream each step (projectConversation(turnEvents)) — projection is full-fidelity and replay-safe; there is no per-step memory growth, but nothing bounds what buildContext receives beyond the window"
    - "docs/02 section 12.3 lists 'old conversation summarization' as the overflow policy; docs/03 M5.1 leaves 'deterministic summary/简单 compaction strategy' unchecked; M5 scenario acceptance requires '1000-turn synthetic session stays bounded'; no test today builds a session longer than ~tens of messages"
    - M5-T001 (accepted) established the two-tier brief law and fail-closed composition; the system fragment is the natural home for a compaction recap because history must stay a pure order-preserving suffix of the projection (tests/property/context-builder.property.test.ts pins this)
  expected: 
    - "buildContext: after the window slice and token-cap loop settle, if droppedMessages > 0 the composed system fragment gains a trailing '## Compacted history' section — one per-line-capped line like 'N earlier messages compacted: U user, A assistant, T tool results' — computed from the dropped fitted messages; zero drops keeps output byte-identical to the M5-T001 projection (existing tests unmodified)"
    - "the summary line is deterministic and honest: counts derive only from the dropped messages; the line passes the same per-fragment byte cap; prompt+brief+summary overflow keeps the M5-T001 fail-closed law (no silent truncation of structured state)"
    - "long-session unit test: a synthetic 1000-turn event stream (turn input, assistant text, periodic tool cycles, durable goal/plan/verification facts) projects via projectConversation, folds via foldSessionEvents without error, and buildContext output stays within every cap: message count <= maxRecentMessages + 1 system message, estimatedTokens <= cap, all non-compactable brief sections present, '## Compacted history' present with matching counts, no compacted message body present"
    - "runTurn integration (ScriptedModel): the same long stream seeded in the store, one scripted turn completes, and the served request is bounded (history length <= maxRecentMessages) with the compaction recap and the durable goal section in the system fragment"
    - docs/02 section 12.3/12.4 record the v1 deterministic compaction line and its composition position; docs/03 M5.1 ticks the last checkbox; docs/subsystems/core.md context section and test list updated
  references: 
    - docs/02-system-design.md
    - docs/03-project-plan.md
    - .praxis/milestones/M5.yaml
    - packages/core/src/context/builder.ts
    - packages/core/src/agent-loop/conversation.ts
    - tests/context-builder.test.ts
    - tests/integration/epistemic-context.integration.test.ts
hypothesis: "A deterministic compaction recap is enough for v1 long sessions: the durable consequences of dropped turns already live in structured brief sections (goal, plan, challenges, verification, observations — M5-T001 law keeps them immune), so the only missing fact is that a prefix was omitted and at what scale; a single per-role count line computed from the dropped messages, composed after the brief and subject to the same fail-closed cap, proves 'long session stays bounded' without model-generated summaries, new budget fields, or touching the event store."
scope: 
  allowed_paths: 
    - .praxis/tasks/M5-T002.yaml
    - .praxis/state.yaml
    - .praxis/handoffs/**
    - packages/core/src/context/**
    - tests/**
    - docs/02-system-design.md
    - docs/03-project-plan.md
    - docs/subsystems/core.md
  forbidden_paths: 
    - packages/contracts/**
    - packages/core/src/state/**
    - packages/core/src/agent-loop/**
    - packages/core/src/capability/**
    - packages/core/src/tools/**
    - packages/core/src/index.ts
    - packages/provider-openai/**
    - packages/store-sqlite/**
