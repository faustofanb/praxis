    - package.json
    - bun.lock
    - docs/acceptance/**
    - docs/decisions/**
  scope_notes: 
    - "run-turn.ts and conversation.ts are deliberately forbidden: the recap is computed inside buildContext from the messages it already drops, so projection and loop are untouched; if evidence contradicts this, amend the contract first."
    - "No new ContextBudget field: the recap is a single line under the existing maxFragmentBytes cap; compaction byte policy stays count-window + token-cap exactly as today."
    - "Model-generated summarization is out of scope by design (docs/02 section 2.5): v1 compaction is a deterministic structured recap; semantic summarization is post-v1 evidence-driven work."
    - "The kept-history suffix property must keep holding unchanged: the recap lives in the system fragment, never as a synthetic history message."
architecture_refs: 
  - .praxis/architecture.yaml
  - docs/02-system-design.md
required_gates: 
  - unit
  - integration
  - property
  - build
acceptance: 
  scenarios: 
    - "1000-turn synthetic session stays bounded: project + fold + buildContext keeps message count within maxRecentMessages (+1 system), estimatedTokens within cap, every non-compactable brief section present, and the compaction recap reports counts matching the dropped messages; building twice is byte-identical"
    - "runTurn integration: the long stream seeded in the store, one scripted turn completes and the served request carries the bounded window plus the recap and the durable goal section in the system fragment"
    - zero dropped messages keeps the composed system fragment byte-identical to the M5-T001 projection (all existing tests unmodified)
  failure_cases: 
    - a recap that lied (counts not matching the actually dropped messages) would break the honesty contract — pinned by exact-count assertions in the long-session test
    - "compaction that deleted or rewrote durable events (instead of bounding the working context) would violate 'Event history 保留，不因 compaction 删除' — rejected: only buildContext output changes, the store is untouched by design and the forbidden list pins conversation/reducer/store"
    - serving a synthetic history message as the recap would break the order-preserving-suffix property — the recap must live in the system fragment
    - weakening the M5-T001 fail-closed law or the two-tier brief law to make the recap fit is forbidden
  artifacts: 
    - packages/core/src/context/builder.ts
    - tests/context-builder.test.ts
    - tests/context-compaction.test.ts
    - tests/integration/epistemic-context.integration.test.ts
    - docs/02-system-design.md
    - docs/03-project-plan.md
    - docs/subsystems/core.md
falsified_if: "The recap cannot be computed from the dropped messages inside buildContext without touching run-turn/conversation/contracts; zero-drop outputs stop being byte-identical; the 1000-turn build exceeds any declared cap or drops a non-compactable brief section; the kept-history suffix property breaks; or the recap requires a model call, a new budget field, or durable-event deletion."
requires_adr: false
requires_human_acceptance: true
