acceptance: 
  scenarios: 
    - "mid-turn unload between hook boundaries: the unloaded policy stops contributing for the REST of the turn (no section, no veto), the stream folds, observers stay accurate"
    - "unload inside a hook iteration: the already-snapshotted sibling contributes for THAT hook only; the next turn is clean; no throw"
    - "an isolate telemetry failure (dead sink) composed with a fail_closed standing-orders policy: byte-identical stream and requests to the policy running alone"
    - "a fail_closed sibling crash: honest wrapped rejection, legal prefix, coherent observer state, successful resume"
  failure_cases: 
    - "any unload probe throwing, corrupting the event stream, or leaving half-applied policy (section without veto, veto without reason) — falsifies the audit"
    - "an isolate failure in one shipped extension altering the durable stream, the other extension's contributions, or the turn outcome in any way"
    - observer state diverging from the durable prefix at crash time (counts must equal the pre-crash facts)
    - weakening or duplicating existing suites instead of adding the audit
  artifacts: 
    - tests/fault/extension-isolation.fault.test.ts
    - docs/subsystems/core.md test entry
falsified_if: "Any probe shows unload mid-turn throwing, racing, or corrupting the stream; or an isolate failure in one shipped extension leaking into the other's contributions or the durable facts; or a fail_closed crash leaving the isolate sibling's state incoherent with the persisted prefix or blocking resume; or the boundary semantics (snapshot per hook invocation) proving observably different from documented — any of these stops the task for evidence rather than an in-scope Core patch."
