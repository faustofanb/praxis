    - docs/subsystems/core.md
falsified_if: "The eight-hook surface cannot be wired into run-turn/tool-runtime without duplicating control flow or reordering authorization; deny-only beforeTool cannot compose after the capability check without touching contracts' capability schema; extension fragments cannot enter buildContext under the existing caps without a builder redesign; fail_closed failures cannot ride the existing crash-recovery path; or the zero-extension identity breaks."
