notes: "Risk C per backlog (Core behavior change over settled runtime; new boundary). Prerequisites M5 accepted (bc2ecd9). Reaches ACCEPTANCE_READY; human sign-off required. M6-T002 (telemetry observer, risk B) and M6-T003 (sample context/tool extension, risk B) build on these seams without further Core edits; M6-T004 (unload/failure isolation verification, risk C) then audits them. The zero-extension identity requirement means the 428-test suite passing unedited is itself evidence."