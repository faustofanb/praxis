acceptance: 
  scenarios: 
    - "an out-of-core (test-file) extension registers, observes a full turn in the documented hook order, contributes a capped context fragment, and denies a tool call — all without editing packages/core beyond this task's one-time seam"
    - "zero-extension identity: runTurn with no registered extensions produces byte-identical requests and event streams to pre-task behavior (existing suites pass unedited)"
    - "unload: after host.unload, the extension's hooks are never invoked again and session behavior is indistinguishable from never-registered; no residual state anywhere (host is instance-scoped)"
  failure_cases: 
    - an extension attempting to authorize what capability denies — unrepresentable by the deny-only ToolHookDecision type and pinned by the security test regardless of extension behavior
    - "a throwing 'isolate' extension hook breaking the turn — swallowed, turn proceeds; a throwing 'fail_closed' hook crashes honestly into the EXISTING crash-recovery path (fault test: prefix folds, resume works)"
    - extension context fragments evicting non-compactable brief sections or escaping the token cap — forbidden by construction through buildContext; over-budget fails closed
    - an extension writing durable events — impossible through the seam (observe-only contexts); pinned by stream-identity assertion in the integration test
    - weakening any existing suite to accommodate the seam
  artifacts: 
    - packages/contracts/src/extensions.ts
    - packages/contracts/src/index.ts
    - packages/core/src/extensions/host.ts
    - packages/core/src/agent-loop/run-turn.ts
