  scope_notes: 
    - "requires_adr TRUE: this adds a new port family (extension seams) — a boundary decision; docs/07 section 4 stop-condition applies even though docs/02 section 19 pre-specifies the shape, because the ADR must record the v1 refinements code commits to (deny-only decision, failure policy table, invocation points, unload law)."
    - "No durable-event vocabulary changes: extensions observe events and contribute context fragments but append NOTHING to the store (section 19 'extension 自己的 durable state 必须以 Event 或独立显式 storage 管理' — extension-owned storage is out of scope for v1 seams; onEvent is read-only). Event/schema change would additionally trigger the M5-T003 version-window procedure and is explicitly not part of this task."
    - "No concrete extension ships in this task: telemetry (M6-T002) and the context/tool sample (M6-T003) follow; test extensions inside test files are fixtures, not product."
    - "runTurn behavior with NO registered extensions must be byte-identical to today (zero-extension identity) — the seam is strictly additive; existing suites passing unedited is part of the evidence, same as M5-T002."
    - "beforeTool composing AFTER the authorizer is load-bearing (ADR-0007): the authorizer/capability decision stays the sole grant path; extensions only add vetoes. Any evidence that a seam forces reordering there stops this task for an ADR amendment."
    - "Context fragments are compactable content under the M5-T001 law: they never displace goal/plan/challenge/pending-indeterminate sections, and an over-budget fragment set fails closed exactly like any other oversize input."
