schema_version: 1
id: M2-T005
title: add CLI run resume and sessions commands
milestone: M2
status: accepted
risk_class: B
objective: "Deliver the M2.5 CLI (docs/03 section 5): a zero-dependency composition root in apps/cli with `run` (create session / send prompt / resume open turn) and `sessions` (list ids+status) commands over the real SQLite store, wired to the M2-T004 agent loop and read-only local tools. The deterministic provider is a script-file model provider owned by the CLI (testkit is forbidden for apps-cli per architecture.yaml) so the M2 human demo runs without network. Store gains listSessions(); durable events stream to stdout as they append via an observing store wrapper."
evidence: 
  observed: 
    - "docs/03 M2.5 lists create session / send prompt / stream model/tool events / resume / list session ids, but apps/cli is still the `export const packageName` stub"
    - "M2 scenario acceptance (user -> scripted model -> read_file -> model -> final, exit and resume without re-running historical tools) has all core pieces since M2-T004 but no operator-facing entry point"
    - EventStore port has no session listing; the sessions table exists (docs/02 section 6.3) but is not exposed
  expected: 
    - "docs/02 section 4.6 fixes apps-cli as composition root; .praxis/architecture.yaml may_depend_on lists [contracts, core, store-sqlite, provider-openai, tools-local] — testkit excluded"
    - "docs/03 M2 exit criteria: process exit then resume rebuilds context from the Event Store without re-running historical read tools"
  references: 
    - docs/03-project-plan.md
    - docs/02-system-design.md
    - .praxis/architecture.yaml
    - .praxis/milestones/M2.yaml
hypothesis: "The CLI can stay a thin composition root: manual argv parsing (no new dependencies), a script-file provider validated through ModelEventSchema at the untrusted file boundary, an observing EventStore wrapper for streaming durable facts as they append, and runTurn for all control flow — so create/send/resume are one command with three argument shapes and the recovery semantics come from core, not from CLI code."
scope: 
  allowed_paths: 
    - .praxis/tasks/M2-T005.yaml
    - .praxis/state.yaml
    - .praxis/handoffs/**
    - .praxis/quality-gates.yaml
    - apps/cli/**
    - packages/store-sqlite/src/session-store.ts
    - packages/store-sqlite/src/index.ts
    - tests/cli/**
    - tests/store/store-sqlite.bun.test.ts
    - docs/subsystems/**
    - package.json
    - bun.lock
    - mise.toml
  forbidden_paths: 
    - packages/contracts/**
    - packages/core/**
    - packages/testkit/**
    - packages/tools-local/**
    - packages/provider-openai/**
    - scripts/ai/**
architecture_refs: 
  - docs/02-system-design.md
  - .praxis/architecture.yaml
required_gates: 
  []
acceptance: 
  scenarios: 
    - "run without --session creates a session, executes a scripted read_file round trip, streams each durable event to stdout, and prints the final text"
    - run --session <id> without --input resumes an open turn (recovery included) and never re-executes historical tools
    - sessions lists session ids with status and head seq from the SQLite metadata
    - "Ctrl-C aborts cooperatively: the attempt is recorded as a failed request and the turn stays resumable"
  failure_cases: 
    - malformed or exhausted script file fails loudly with a non-zero exit and no partial silent success
    - unknown command or missing required flags prints usage on stderr and exits non-zero
    - run --session <id> --input against an open turn is rejected by core rules surfaced as a CLI error
    - run without --script (no provider configured yet) refuses to start instead of guessing a model
  scope_notes: 
    - "tests/store/store-sqlite.bun.test.ts is in scope because its public-surface assertion must grow with listSessions (owning-test update, not a weakening); all other store tests stay untouched"
  artifacts: 
    - tests/cli/cli.bun.test.ts
    - docs/subsystems/cli.md
    - .praxis/handoffs/ generated by ai:handoff
falsified_if: "The CLI needs its own loop/recovery logic, a new runtime dependency, or imports from testkit; or resume re-runs a historical tool execution."
requires_adr: false
requires_human_acceptance: false