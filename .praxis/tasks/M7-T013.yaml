  scope_notes: 
    - "BASELINE.md/README/M7.md are forbidden HERE: the matrix-version note and the five re-run registrations are operator evidence commits made after acceptance (precedent 78200e6/2f53d87/6b14836/4cf7d70) — keeping the contract purely the vocabulary change"
    - "Seeds/prompts/expected sets unchanged: the rows' laws are sound (docs/02 s8.3/s13/s14 are the runtime's actual behavior); only the vocabulary surface that models read was under-specified — if the re-run disproves that, the next change is a scenario redesign with its own contract"
    - "Descriptions stay model-neutral and scenario-independent: they describe what each action MEANS and which runtime laws govern it — the same text every model sees on every scenario (no answer leaking; the per-row expected sets remain the grading truth)"
    - "No core change: the completion refusal law goes in the decide description, not the core brief renderer — the brief already states the blocking fact; the vocabulary states the consequence. If the re-run shows the brief itself needs new sections, that is a core task with its own contract"
architecture_refs: 
  - .praxis/architecture.yaml
  - docs/02-system-design.md
required_gates: 
  - unit
  - property
  - integration
  - replay
  - build
acceptance: 
  scenarios: 
    - "the seven descriptions carry the anchors: verify_or_reconcile names executions/unknown outcome; re_verify names verification records/inconclusive; continue names plan-of-record persistence; declare names runtime refusal; pinned by scenarios.test.ts"
    - "DECIDE_ACTIONS order, seeds, prompts, expectedActions, law fields byte-unchanged — only description strings differ"
    - full unit gate green; grader/harness suites unaffected
  failure_cases: 
    - an expected-set or seed change smuggled in as a description tweak
    - a description that leaks a per-scenario answer (e.g. naming a specific action as correct in a specific situation)
    - a core or contracts edit
  artifacts: 
    - evals/development-models/scenarios.ts (seven descriptions)
    - evals/development-models/scenarios.test.ts (anchor pins)
falsified_if: "The vocabulary sharpening cannot be expressed without touching seeds, prompts, expected sets, or production code — i.e. the defect was not in the descriptions. In that case the failing rows go back to scenario design with a new contract."
requires_adr: false
requires_human_acceptance: false
notes: "Risk A per backlog authoring (eval-owned description strings + test pins; zero production code). Direct operator authorization 2026-08-30 ('继续' on the two-defect report). Matrix version bump: v1 descriptions -> v2 anchored descriptions; comparability break recorded at re-registration."