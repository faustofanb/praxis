  allowed_paths: 
    - .praxis/tasks/M7-T007.yaml
    - .praxis/state.yaml
    - .praxis/handoffs/**
    - .praxis/backlog.yaml
    - docs/10-memory-context-growth.md
    - docs/03-project-plan.md
    - docs/subsystems/core.md
