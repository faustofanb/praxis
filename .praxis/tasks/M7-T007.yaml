    - packages/**
    - apps/**
    - tests/**
    - scripts/**
    - evals/**
    - package.json
    - bun.lock
    - tsconfig.json
    - mise.toml
    - vitest.config.ts
    - knip.json
    - .praxis/quality-gates.yaml
    - .praxis/milestones/**
    - docs/acceptance/**
    - docs/02-system-design.md
    - docs/09-dependency-inventory.md
    - docs/subsystems/README.md
    - docs/subsystems/contracts.md
    - docs/subsystems/provider-openai.md
    - docs/subsystems/store-sqlite.md
    - docs/subsystems/testkit.md
    - docs/subsystems/tools-local.md
    - docs/subsystems/cli.md
    - docs/subsystems/extension-standing-orders.md
    - docs/subsystems/extension-telemetry.md
