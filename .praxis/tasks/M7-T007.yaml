    - AGENTS.md
  scope_notes: 
    - "One fact, one home respected three ways: numbers live in tests/soak (machine), the budget law lives in docs/02 s12.3 (law), the report lives in docs/10 (interpretation + links) — the report is forbidden from restating formulas or caps as if it were their authority"
    - "Timing numbers are quoted as observations with run variance noted, never as pins — only the soak test's structural assertions are contracts"
    - "No ADR: no decision changes; the deferred optimization stays deferred (core.md already records it)"
    - "SQLite storage growth is described at the law level (one row per event, append-only) with a link to docs/subsystems/store-sqlite.md — not re-measured"
architecture_refs: 
  - .praxis/architecture.yaml
  - docs/02-system-design.md
required_gates: 
  - unit
  - property
  - integration
  - replay
  - build
acceptance: 
  scenarios: 
    - "the report exists, cites the soak suite and budget constants as the homes of every number, and states the growth model (store linear, derived state exactly linear, context bounded, fold cost tripwired)"
    - "full unit gate green with the soak suite in it (the report's evidence re-proves itself every verify run)"
    - "docs/03 row ticked with provenance; subsystem core.md links the report"
  failure_cases: 
    - "a number in the report that contradicts the soak test or the budget constants (drift) — the report must quote from the pinned sources, and any discrepancy stops acceptance for investigation, not for editing the test to match prose"
    - "the report duplicating the closed-form formulas or cap values as its own authority instead of linking (one fact, one home)"
    - "inventing a measurement the soak does not produce (e.g. real-model token costs) — out of scope"
  artifacts: 
    - docs/10-memory-context-growth.md
    - docs/03-project-plan.md M7 row tick
    - docs/subsystems/core.md report link
    - .praxis/backlog.yaml M7-T007 entry
falsified_if: "The growth question cannot be answered from existing pinned measurements — i.e. the report would need new instrumentation, new soak scenarios, or production-code changes to be honest. Also falsified if the pinned numbers and the report's quotes disagree (the soak must win; re-planning, not prose-fixing)."
requires_adr: false
requires_human_acceptance: false
notes: "Risk A per backlog authoring (documentation over already-pinned facts; every number's home exists and is machine-verified). requires_human_acceptance FALSE (precedent M7-T001/T003/T004/T005/T006): the unit gate re-proves the soak facts the report cites. The report deliberately does NOT restate the M7-T003 docs/03 row prose — it links and goes deeper on the growth model. Remaining untasked M7 docs/03 rows after this: SQLite corruption/recovery policy documented, Core coverage target, Bun 1.4 compatibility branch test."
