  scope_notes: 
    - "risk B: additive out-of-core package; the M6 'without core edit' scenario is enforced mechanically — packages/core/** and packages/contracts/** are forbidden paths, so any seam gap discovered mid-task stops the task for evidence (falsified_if) rather than a Core patch"
    - "No durable-event vocabulary change and no stream writes: the observer consumes hooks only; its own state is closure-scoped counters (ADR-0013: extension durable state is out of scope for v1; snapshot() is an in-memory read, not an Event)"
    - "contributeContext and beforeTool are intentionally NOT implemented: observe-only extensions add zero prompt bytes and must never sit on the veto path (beforeTool is the deny seam; telemetry has no opinion). The context-contributor sample is M6-T003."
    - "External sinks are app wiring: the optional sink callback is the only integration point; wiring it into apps/cli is out of scope (apps/** forbidden). Default is in-memory snapshot only."
    - "M6-T004 audits unload/failure isolation adversarially across shipped extensions; this task pins consumer-level behavior (snapshot survives unload, throwing sink isolates) sufficient for the M6 scenario row."
architecture_refs: 
  - .praxis/architecture.yaml
  - docs/02-system-design.md
  - docs/decisions/ADR-0013-extension-seams-v1.md
required_gates: 
  - unit
  - integration
  - replay
  - fault
  - security
  - build
acceptance: 
  scenarios: 
    - "telemetry observer registered via the real createExtensionHost into runTurn deps over a scripted tool-calling turn: snapshot turn/model/tool/event histograms exactly equal the folded stream facts; the event stream is identical to the same run without the observer (zero-extension identity preserved — the observer writes nothing)"
    - "redaction is structural: serialized snapshot contains no tool-argument/tool-output/model-text markers (marker test) because the schema carries only counts/durations/enums/names"
    - "determinism: injected clock produces exact recorded latencies/durations; two runs with the same clock and scripts produce identical snapshots"
    - "unload: after host.unload, a subsequent turn grows zero counters while snapshot() stays readable and frozen"
  failure_cases: 
    - a throwing sink on every record — the turn completes with the correct event stream (docs/02 §19 isolate law at consumer level)
    - "mis-counting (asserting exact histogram equality against the folded stream, not ≥/contains) — a wrong count fails acceptance"
    - "the observer influencing the loop in any way (added events, changed requests, vetoed tools) — structurally absent (no such hooks) and pinned by stream identity"
  artifacts: 
    - "packages/extension-telemetry (package.json, tsconfig.json, src/index.ts, src/telemetry.ts)"
    - root tsconfig.json project reference
    - tests/extensions/telemetry.test.ts
    - docs/subsystems/extension-telemetry.md
    - docs/03-project-plan.md M6 tick
falsified_if: "Any required telemetry datum (turn outcome, model result kind, tool name/status, event type, ordering) is missing from the M6-T001 hook contexts so the observer needs Core edits; or accurate counting is impossible without reading payloads (it must not); or latency/duration cannot be measured with an injected clock; or the snapshot can be made to carry payload text; or unload corrupts/freeze-breaks the snapshot."
requires_adr: false
requires_human_acceptance: false
notes: "Risk B per backlog (prerequisite M6-T001 accepted c605a82). No ADR: the boundary decision is ADR-0013's; this task is its first consumer and must not move any boundary. Machine acceptance per ai-policy for risk B; M6 milestone promotion still requires independent/human acceptance (M6.yaml). M6-T003 (context/tool sample) and M6-T004 (isolation audit) follow."