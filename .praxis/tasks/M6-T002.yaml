  allowed_paths: 
    - .praxis/tasks/M6-T002.yaml
    - .praxis/state.yaml
    - .praxis/handoffs/**
    - packages/extension-telemetry/**
    - tsconfig.json
    - tests/extensions/telemetry.test.ts
    - docs/03-project-plan.md
    - docs/subsystems/extension-telemetry.md
