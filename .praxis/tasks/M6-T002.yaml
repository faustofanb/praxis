schema_version: 1
id: M6-T002
title: implement telemetry observer extension
milestone: M6
status: plan_ready
risk_class: B
objective: "Close docs/03 M6 'sample extension：只读 telemetry'（.praxis/milestones/M6.yaml required_deliverables 'telemetry extension'）by shipping the FIRST real consumer of the M6-T001 seams — proving M6 scenario acceptance 'extension adds tool/context/event observer without core edit' for the telemetry half with ZERO edits under packages/core and packages/contracts (enforced by forbidden_paths). Observed state: the seams exist and are pinned (M6-T001 accepted c605a82; ADR-0013; host/observing-store/deny-only beforeTool/all eight invocation points), but every extension in the tree is a test fixture — no product extension exists anywhere (grep createExtensionHost outside tests/core: only run-turn/tool-runtime wiring). docs/02 §19 fixes the failure-policy default for this exact class ('默认 telemetry 走 isolate') and docs/02 §20 fixes the redaction law ('禁止把秘密、完整敏感 Tool output 无条件写 telemetry'，line 1096; 'telemetry 必须 redaction'，line 1004) — neither is yet embodied in code. Deliverable: (1) new private workspace package @praxis/extension-telemetry (deps: @praxis/contracts ONLY — the extension is an app-owned value implementing the contracts interface; it must not depend on core, and core must not know it exists); (2) createTelemetryObserver(options?) returning an instance-scoped observer {extension, snapshot()} whose extension (name 'telemetry-observer', failurePolicy 'isolate' per docs/02 §19) implements the observe-only hooks: onTurnStart/onTurnEnd (turn counts, outcome histogram, turn duration), beforeModel/afterModel (request count, latency, provider errors, endedSilently, tool-call count), afterTool (per-tool-name per-status histogram over EXTENSION_TOOL_RESULT_STATUSES), onEvent (per-event-type histogram + total) — deliberately NOT contributeContext (observe-only extension adds no prompt bytes) and NOT beforeTool (telemetry must never sit on the veto path); closure-scoped counters only (AGENTS.md no-module-global law), injectable now() clock for determinism, optional sink callback per observed fact for later CLI wiring; (3) redaction made STRUCTURAL: TelemetrySnapshot's schema carries only counts/durations/enums/names — no field is capable of holding tool arguments, tool output, or model text — pinned by a marker test asserting the serialized snapshot contains none of the payload markers; (4) tests/extensions/telemetry.test.ts: full-turn accuracy against ScriptedModel + a real tools-local tool through runTurn (snapshot histograms exactly equal the folded stream, not merely ≥), REJECTED + providerError paths counted, injected-clock determinism, throwing sink leaves the turn unbroken (isolate at consumer level), snapshot readable and frozen after host.unload with counts stopped; (5) docs/subsystems/extension-telemetry.md + README.md index row; docs/03 M6 'sample extension' ticked with M6-T002 provenance."
evidence: 
  observed: 
    - "grep -rn 'createExtensionHost' packages apps: only packages/core/src (the host itself) — every extension in the tree lives inside a test file; .praxis/milestones/M6.yaml required_deliverables lists 'telemetry extension' and docs/03 M6 line 338 has 'sample extension：只读 telemetry（M6-T002）' unticked"
    - "docs/02 §19 line 1034 already fixes this extension's failure policy: '默认 telemetry 走 isolate（吞掉错误、该 hook 零贡献）'; §19 line 1096 + line 1004 fix the redaction law: no secrets, no full sensitive tool output, telemetry must redact"
    - "M6.yaml scenario_acceptance: 'extension adds tool/context/event observer without core edit' — M6-T001 landed the seams but no shipped extension demonstrates the scenario; M6-T004 (unload/failure isolation) lists M6-T002 as a prerequisite, so this task must exist before the audit"
    - "packages layout precedent: app-owned capabilities ship as sibling private packages (tools-local: name @praxis/tools-local, exports ./src/index.ts, deps @praxis/contracts 0.0.0 exact, own tsconfig extending tsconfig.base.json, referenced from root tsconfig.json)"
  expected: 
    - "packages/extension-telemetry/package.json (private, module, exports '.', deps @praxis/contracts 0.0.0 only) + tsconfig.json (extends ../../tsconfig.base.json, composite, include src) + root tsconfig.json gains the project reference"
    - "packages/extension-telemetry/src/telemetry.ts: TelemetrySnapshot (frozen, serializable: turns{started,completed,byOutcome}, model{requests,providerErrors,endedSilently,toolCalls,totalLatencyMs,turnDurationsMs?}, tools per name per EXTENSION_TOOL_RESULT_STATUSES count, events per SessionEventUnion type count, totals) — no string field that could carry payload; createTelemetryObserver(options?: {now?: () => number; sink?: (record: TelemetryRecord) => void}): TelemetryObserver {extension: PraxisExtension ('telemetry-observer', isolate); snapshot(): TelemetrySnapshot}"
    - "hook coverage exactly: onTurnStart, onTurnEnd, beforeModel, afterModel, afterTool, onEvent (six of eight; contributeContext/beforeTool intentionally absent and documented)"
    - "tests/extensions/telemetry.test.ts: (a) full scripted turn with one SUCCEEDED read_file + one extension-denied/REJECTED path through the real host in runTurn deps — snapshot tools/test-event histograms EXACTLY match the stream's folded facts; (b) marker redaction: tool output text, model text, and tool arguments markers absent from JSON.stringify(snapshot()); (c) injected fake clock yields exact latencyMs values; (d) sink that throws on every record — turn still completes with correct events (isolate consumer evidence); (e) host.unload('telemetry-observer') then another turn — snapshot unchanged by the second turn, still readable"
    - "docs/subsystems/extension-telemetry.md (current behavior, links to docs/02 §19/§20 + ADR-0013, no law duplication) + index row in docs/subsystems/README.md; docs/03 M6 'sample extension' ticked (M6-T002)"
  references: 
    - docs/02-system-design.md
    - docs/03-project-plan.md
    - .praxis/milestones/M6.yaml
    - packages/contracts/src/extensions.ts
    - packages/core/src/extensions/host.ts
    - docs/decisions/ADR-0013-extension-seams-v1.md
    - packages/tools-local/package.json
hypothesis: "The M6-T001 surface is complete for real consumers: a read-only telemetry observer is pure composition over the six observe-only hooks with zero edits to packages/core or packages/contracts, and every datum it needs (turn outcomes, model result kinds, tool names/statuses, event types) is already carried by the hook contexts M6-T001 defined. Redaction can be structural rather than procedural: if the snapshot schema has no payload-capable field, no future hook bug can leak tool output or model text. Determinism comes from an injected clock, not from trusting wall time."
