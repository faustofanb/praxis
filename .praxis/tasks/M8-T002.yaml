schema_version: 1
id: M8-T002
title: finalize cli quickstart sample sessions and replay demo
milestone: M8
status: planned
risk_class: B
objective: "Close the docs/03 M8 deliverable rows 'CLI quickstart' and 'sample session/replay' (M8-T002, risk B, prerequisites [M7]). Observed gap: apps/cli currently wires ONLY localReadTools (src/index.ts:276) and passes NO authorizer to runTurn — so the M8 scenario acceptance path 'clean install -> read task -> write task -> approval -> resume/fork' is impossible at the CLI layer today: there is no write task and no approval surface. The runtime pieces all exist: runTurn accepts options.authorizer (ToolAuthorizer; absent = readOnlyAuthorizer so writes are always rejected), and core exports capabilityAuthorizer({policy, now}) whose CapabilityPolicyConfig semantics are exactly the approval story — a grant allows, a capability listed in approvableCapabilities WITHOUT a grant returns requires_approval and rejects fail-closed with an explicit reason (ADR-0007: 'approval UX is an extension, and its absence must never open the gate'). Deliverable: (a) apps/cli/src/index.ts — wire localWriteTools alongside localReadTools (both bound to --root), add two flags --allow-write and --allow-bash that append the corresponding grants ({name: 'fs.write'|'shell.exec', scope {kind workspace, root}}) to a capabilityAuthorizer policy whose workspaceRoots=[root], approvableCapabilities=['fs.write','shell.exec'], leases=[], now=the CLI clock; pass that authorizer in runTurn options. Semantics: no flag => write attempts are durable ToolRejected with the requires_approval reason (honest, fail-closed); --allow-write => write_file executes. Usage text and help updated. (b) tests/cli/cli.bun.test.ts — new cases: a write task WITH --allow-write lands the file (SUCCEEDED fact + filesystem effect); WITHOUT the flag the write is rejected as a durable ToolRejected fact with the approval reason and no filesystem effect; --allow-bash grants shell.exec (one bash round-trip). (c) docs/13-cli-quickstart.md (new) — the quickstart: install (mise), a deterministic read task via --script (full script-file sample + real output excerpt), a real-model run via --model, the write task with approval semantics (default-deny shown, then --allow-write), crash/resume demo (SIGINT or killed process -> --session resume; the kill->resume->finish acceptance path), sessions listing (replay/inspection demo), and the exit-code table. Every command copy-paste runnable. (d) README.md links the quickstart. (e) docs/subsystems/cli.md — owning doc updated for the new flags/tools/authorizer wiring. (f) docs/03-project-plan.md — tick 'CLI quickstart' and 'sample session/replay'. This delivers the M8 scenario-acceptance surface; its formal acceptance run is M8-T003."
evidence: 
  observed: 
    - "apps/cli/src/index.ts:276 wires localReadTools only; no authorizer is passed to runTurn (defaults to readOnlyAuthorizer) — no write path at the CLI layer"
    - "run-turn.ts:124 exposes options.authorizer (ToolAuthorizer: name/effect/argumentsJson/requiredCapability -> authorized|rejected-with-reason); core exports capabilityAuthorizer + CapabilityPolicyConfig (workspaceRoots/grants/leases/approvableCapabilities) with requires_approval rejecting fail-closed (ADR-0007)"
    - "write tools declare requiredCapability scoped to the bound root (write-tools.ts:75 fs.write, :184 shell.exec) — they register fine and are gated at authorization time"
    - "tests/cli/cli.bun.test.ts exists (bun runner) and drives main(argv, io) directly — the new flag cases extend that suite"
  expected: 
    - "CLI: write tools always registered alongside read tools; --allow-write/--allow-bash append grants; capabilityAuthorizer wired into every runTurn call; help/usage updated"
    - "new bun cli tests: authorized write lands (fact + fs), unauthorized write rejected as durable ToolRejected with approval reason (no fs effect), bash round-trip under --allow-bash"
    - "docs/13-cli-quickstart.md: copy-paste-runnable quickstart incl. sample session via --script, replay/resume demo, approval demo, exit codes"
    - "README links quickstart; docs/subsystems/cli.md updated; two docs/03 rows ticked"
  references: 
    - apps/cli/src/index.ts
    - packages/core/src/capability/authorizer.ts
    - packages/core/src/capability/policy.ts
    - packages/tools-local/src/write-tools.ts
    - tests/cli/cli.bun.test.ts
    - docs/subsystems/cli.md
hypothesis: "The approval surface is pure assembly: the authorizer, policy config, capability gates, and durable rejection facts all exist in core — the CLI only lacks the flags, the grant wiring, and the runTurn option. If wiring capabilityAuthorizer into the CLI reveals a real core gap (e.g. a decision type the CLI cannot surface), that is a re-plan, not a CLI workaround."
