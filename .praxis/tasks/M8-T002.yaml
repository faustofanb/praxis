  scope_notes: 
    - "Default stays fail-closed: without --allow-write/--allow-bash the CLI behavior for write attempts is a durable ToolRejected fact carrying the requires_approval reason — the quickstart demos this BEFORE the allowed path"
    - "bash is a separate flag from write (shell.exec is the wider blast radius); neither implies the other"
    - "No interactive approval prompt in v1: grants are static per invocation — interactive approval UX is explicitly an extension concern (ADR-0007) and the policy's approvableCapabilities field documents what a future extension may lease"
    - "core/contracts FORBIDDEN: the entire surface already exists there"
    - "quickstart uses --script for the deterministic walkthrough AND --model for the real-model path; no new package exports needed"
