acceptance: 
  scenarios: 
    - "bun cli suite green incl. the three new authorization cases (authorized write lands; unauthorized write durable-rejected with approval reason; bash round-trip)"
    - "quickstart commands reproduce end-to-end on a clean temp dir (script-based walkthrough) — verified before commit"
    - "docs/03 rows 'CLI quickstart' and 'sample session/replay' ticked; cli.md owning doc current"
  failure_cases: 
    - "a flag that grants silently beyond its name (--allow-write must not touch shell.exec and vice versa)"
    - "write attempts that vanish without a durable rejection fact when unauthorized"
    - "an authorizer that bypasses the workspace scope check (root escapes deny outright)"
  artifacts: 
    - apps/cli/src/index.ts (write tools + authorizer wiring + flags)
    - tests/cli/cli.bun.test.ts (3 new cases)
    - docs/13-cli-quickstart.md
    - README.md link + docs/subsystems/cli.md + docs/03 ticks
falsified_if: "The capability surface cannot be assembled at the CLI without core/contracts changes (it can — every piece exists), or an unauthorized write produces anything other than a durable, honest ToolRejected fact."
requires_adr: false
requires_human_acceptance: false
notes: "Risk B per backlog (CLI behavior change: new flags and an authorization surface — but strictly assembling existing core law, fail-closed by default). Machine-acceptable (flags false). M8-T003 will run the formal scenario acceptance over this surface."
