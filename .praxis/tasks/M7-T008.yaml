  scope_notes: 
    - "docs/02 §17 and §16 are FORBIDDEN to edit: the runtime recovery law and single-writer law are owned there and stay untouched — the policy doc links them; if linking reveals a genuine law gap, that is a re-plan, not an in-scope law edit"
    - "The v1 file-level stance (no online repair, restore from backup) is the one new normative statement — it is a LIMITATION declaration consistent with §17's prohibitions and ADR-0004's simplicity consequences, not a decision reversal, hence no ADR"
    - "One fact, one home: corruption-detection test lives where it lives (store suite); the policy doc must not restate the crash matrix table — §17 keeps it"
    - "No production code: if the doc-writing process surfaces a real store deficiency (e.g. a corruption mode the tests miss), stop and re-plan — do not stretch the doc to claim untested properties"
