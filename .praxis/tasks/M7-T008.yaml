acceptance: 
  scenarios: 
    - "the policy doc exists with prevention/detection/recovery layers, every normative statement tracing to a pinned test or law, and the v1 limitations explicitly labeled"
    - "full unit gate green (unchanged code) — the evidence the policy cites re-proves itself every verify run"
    - "docs/03 row ticked with provenance; store-sqlite.md points to the policy"
  failure_cases: 
    - "a policy claim with no backing fact (e.g. asserting a corruption mode is tolerated when no test pins it) — fabrication, stops acceptance"
    - "the doc duplicating §17's crash matrix or the prohibitions list instead of linking (one fact, one home)"
    - "an edit to docs/02 or docs/decisions sneaked in to make the policy read better — out of scope"
  artifacts: 
    - docs/11-sqlite-corruption-recovery.md
    - docs/03-project-plan.md M7 row tick
    - docs/subsystems/store-sqlite.md pointer
    - .praxis/backlog.yaml M7-T008 entry
falsified_if: "Any policy layer lacks a backing pinned fact or law (prevention/detection/recovery must each trace), or writing the policy honestly requires changing production code, tests, or the owning laws — then the documentation-only hypothesis fails and the gap must be re-scoped as store work with its own contract."
requires_adr: false
requires_human_acceptance: false
notes: "Risk A per backlog authoring (documentation over already-pinned facts; the only new normative content is a v1 limitation declaration). requires_human_acceptance FALSE (precedent M7-T001 through T007). Remaining untasked M7 docs/03 rows after this: Core coverage target, Bun 1.4 compatibility branch test — then the M7 milestone human acceptance."
