schema_version: 1
id: M7-T008
title: document the sqlite corruption and recovery policy
milestone: M7
status: planned
risk_class: A
objective: "Close the docs/03 M7 quality-gate row 'SQLite corruption/recovery policy documented' (M7-T008, risk A, backlog entry added with this contract). Observed state: the substance already exists and is machine-tested, but it is scattered and the POLICY-level answer ('what does the system do when the sqlite file is corrupted, and what may an operator do about it') has no home. Facts available: docs/02 §17 owns the runtime recovery LAW (9-step orchestration + the six-cell crash matrix, M5-T004, embodied in tests/fault/crash-matrix.fault.test.ts + tests/store/crash-recovery.bun.test.ts) and the absolute-prohibitions list; docs/subsystems/store-sqlite.md owns current store behavior (WAL journal mode, optimistic-concurrency single-transaction append, per-row SessionEventUnionSchema.parse on read because persisted bytes are an untrusted boundary, monotonic migrations failing closed on version divergence, append-only public surface with no UPDATE/DELETE path); tests/store/store-sqlite.bun.test.ts pins corruption detection (a corrupted actor_json row fails validation on read — fail closed, no silent skip); ADR-0004 owns the bun:sqlite-without-ORM decision; docs/02 §16 owns the single-writer law. What is MISSING: (1) a corruption POLICY document that separates PREVENTION (WAL, append-only surface, single writer, transactional append, fail-closed migrations — corruption by construction is limited to out-of-process factors) from DETECTION (every read re-validates; version divergence fails at open) from RECOVERY (runtime-level = §17's law, linked not duplicated; file-level = v1 has NO online repair tooling by design — the event stream is the single source of truth so the runtime cannot and must not 'repair' it; the operator restores the database file from filesystem backup, after which prefix-replay + migration idempotence are already test-proven), and states explicitly what v1 does NOT provide (checksum columns, online repair, automatic backup tooling, partial stream recovery) and under what evidence those would be revisited; (2) the docs/03 row tick. Deliverable: docs/11-sqlite-corruption-recovery.md (new, the policy's ONE home — links every authority, duplicates no law), docs/subsystems/store-sqlite.md gains one pointer line to the policy, docs/03 ticked with provenance, .praxis/backlog.yaml gains the M7-T008 entry. No production code, no test changes: every policy statement must trace to an existing pinned fact or be an explicit, labeled v1 limitation."
evidence: 
  observed: 
    - "docs/03 M7 row 'SQLite corruption/recovery policy documented' unchecked; no doc answers the file-level corruption question"
    - "detection is test-pinned: tests/store/store-sqlite.bun.test.ts 'corrupted actor JSON fails validation on read' (raw UPDATE to 'not-json' outside the store API, readStream then throws)"
    - "prevention is real and documented in fragments: WAL (db.ts journal_mode), single-writer (docs/02 §16), single-transaction append with optimistic head check + gap rejection + metadata update in one transaction (store-sqlite.md), fail-closed version divergence (migrations.ts), append-only public surface"
    - "runtime recovery law is fully documented in docs/02 §17 incl. crash matrix and prohibitions; M5-T004 embodied it in two test suites"
    - "ADR-0004 owns the engine decision; the file-level corruption policy is NEW normative content (operator guidance + v1 limitations) that no existing doc owns"
  expected: 
    - "docs/11-sqlite-corruption-recovery.md (new): prevention / detection / recovery layers, each statement linked to its authority; runtime recovery = link to §17; file-level = restore-from-backup policy with the v1-no-online-repair limitation stated as normative; revisitable triggers listed"
    - "docs/subsystems/store-sqlite.md: one pointer line to the policy doc"
    - "docs/03-project-plan.md: '- [ ] SQLite corruption/recovery policy documented' -> - [x] with (M7-T008: …) provenance"
    - ".praxis/backlog.yaml: M7-T008 entry (id/order 80/title/prerequisites [M5]/risk A)"
    - "zero changes to packages/**, tests/** — the policy traces; it does not re-pin"
  references: 
    - docs/02-system-design.md
    - docs/subsystems/store-sqlite.md
    - tests/store/store-sqlite.bun.test.ts
    - tests/fault/crash-matrix.fault.test.ts
    - tests/store/crash-recovery.bun.test.ts
    - packages/store-sqlite/src/migrations.ts
    - docs/decisions/ADR-0004-sqlite.md
hypothesis: "The corruption/recovery policy is fully determined by existing pinned facts plus one honest normative addition (v1 file-level stance: fail closed + restore from backup + no online repair); writing it down requires zero code or test changes. If any layer (prevention/detection/recovery) turns out to be unbacked by an existing test or law, the hypothesis falsifies and the gap becomes a store task, not a doc sentence."
