    - mise.toml
    - package.json
    - bun.lock
    - knip.json
    - vitest.config.ts
    - .github/**
    - AGENTS.md
  scope_notes: 
    - "All experiments in /tmp clones; the main tree is only touched by this contract, state.yaml, handoffs, and docs/acceptance/M8.md"
    - "risk C per backlog: an acceptance-run task over already-accepted surfaces (M7-T003 risk-C precedent: machine acceptance on recorded evidence)"
    - "Human Demo, Real-model eval (M8-T004), non-goals/changelog (M8-T005), and the M8 Exit Decision stay pending — this task closes the engineering scenario/failure portions only"
architecture_refs: 
  - .praxis/architecture.yaml
  - docs/07-architecture-conformance.md
required_gates: 
  - unit
  - property
  - integration
  - replay
  - build
  - cli
  - store
acceptance: 
  scenarios: 
    - "clean clone: frozen install + all four walkthrough scenarios + kill->resume->finish recorded with real outputs at the clone HEAD"
    - "failure injections (architecture violation, pin violation) fail their gates with non-zero exits and are reverted"
    - docs/acceptance/M8.md scenario/failure sections ticked with the recorded evidence
  failure_cases: 
    - a scenario step that only passes in the main tree (clone divergence is the blocker this task hunts)
    - an injection that does NOT fail its gate (a gate that cannot fail is not a gate — re-plan)
    - experiments leaking into the main tree (any uncommitted main-tree change from the experiments)
  artifacts: 
    - docs/acceptance/M8.md (scenario + failure sections with evidence)
falsified_if: "The clean clone cannot complete the scenario path (frozen install failure, quickstart divergence) or a gate fails to fail on a real injected violation — either is a release blocker that must be reported and re-planned, never worked around in the clone."
requires_adr: false
requires_human_acceptance: false
notes: "Risk C per backlog: acceptance-run over accepted surfaces, machine acceptance on recorded evidence (M7-T003 precedent). Real-model release eval is M8-T004; non-goals/changelog/release-checklist is M8-T005; M8 milestone human acceptance follows."