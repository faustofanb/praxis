    - "knip wiring already exists everywhere it should: mise.toml [tasks.knip] in the check chain (line 108) and check:all; .praxis/quality-gates.yaml command id knip (line 55-58) + dependencies rule require (line 146); .praxis/milestones/M7.yaml machine_gates includes knip — the gap is findings, not wiring"
    - "SessionPlanBlock usages are all intra-file (lines 232/236/242 of tests/helpers/full-vocabulary-machine.ts); the consuming property test imports translateSessionPlan only — the export keyword is dead weight, not API"
    - "experiment: removing scripts/ai/*.ts from the entry array instead of relocating it produces TWO new 'Unused files' findings (check-architecture.ts, praxis-dev.ts) — the entry globs are required; only the top-level shape is deprecated"
    - "experiment: with the export keyword dropped and the entry array moved under workspaces['.'], bun run knip prints nothing and exits 0; tsc -b clean; property suite 23/23; biome clean on both files"
  expected: 
