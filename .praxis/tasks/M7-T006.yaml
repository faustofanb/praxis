notes: "Risk A per backlog authoring (two-file mechanical diff, both fixes experimentally verified on the working tree BEFORE the contract was written; knip zero-output zero-exit confirmed). requires_human_acceptance FALSE (precedent M7-T001/T003/T004/T005): the knip gate itself re-proves the deliverable inside verify. The knip gate had never run in my previous verify cycles because no prior M7 contract touched a dependencies-rule-matched manifest — this task makes it explicit in required_gates. Remaining untasked M7 docs/03 rows after this: Core coverage target, memory/context growth report, SQLite corruption/recovery policy, Bun 1.4 compatibility branch test — each needs its own backlog entry + cycle."