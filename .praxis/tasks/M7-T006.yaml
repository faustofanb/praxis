objective: "Close the docs/03 M7 quality-gate row 'Knip zero unexpected findings' and the backlog entry added for it (M7-T006, risk A, prerequisites [M7-T001]). The knip gate is fully wired already (mise task knip -> bun run knip; inside the mise check chain since M0; a registered quality-gates command; listed in .praxis/milestones/M7.yaml machine_gates and in the dependencies rule's require set) — but the gate has been RED since M7-T001 landed: bun run knip today reports (1) an unused exported type SessionPlanBlock in tests/helpers/full-vocabulary-machine.ts:226 — the M7-T001 shadow machine exports a type that nothing outside the module imports (verified: all usages — SessionPlanBlock reference at :232, turnBlockArbitrary at :236, interludeBlockArbitrary at :242 — are inside the same file; the property test imports only translateSessionPlan) — and (2) a knip configuration hint: the top-level knip.json entry array (scripts/ai/*.ts + scripts/smoke/*.ts + evals/development-models/*.ts) triggers knip 6.x's 'Remove, or move unused top-level entry to one of workspaces' hint, because knip now wants root entries declared inside a workspaces block. The hint alone does not fail the exit code (verified: after fixing only the type, knip exits 0) but it IS a finding in the report, and the row says ZERO unexpected findings. Deliverable, all verified experimentally before this contract: (a) tests/helpers/full-vocabulary-machine.ts — drop the export keyword on SessionPlanBlock (the type stays; it is module-private by use; SessionPlan remains exported and referenced through translateSessionPlan's signature — no behavior change, property suite 23/23 green after the edit); (b) knip.json — move the identical entry array under { workspaces: { .: { entry: [...] } } } exactly as the hint directs (the entries themselves are load-bearing: experimentally removing scripts/ai/*.ts makes knip flag scripts/ai/check-architecture.ts + praxis-dev.ts as unused files, so the globs stay byte-identical, only the shape moves); result: bun run knip prints NOTHING and exits 0 (verified on the working tree); (c) docs/03-project-plan.md — tick the M7 row 'Knip zero unexpected findings' with provenance. No gate wiring changes: knip rides the existing mise task/registry entries; required_gates for this contract adds knip itself so verify re-proves zero findings at the acceptance commit."
