acceptance: 
  scenarios: 
    - "an escape path with the capability fully granted still never touches the filesystem outside the root, through the real runtime (executeToolCall), and lands as a provable ToolFailed"
    - a crashed write whose symlinked path was retargeted after the crash reconciles to indeterminate and escalates to a paused session — the failed-unlocks-re-execution attack is closed
    - symlink-aliased workspace roots cannot satisfy the lexical capability scope; mismatches fail closed
  failure_cases: 
    - "a forged INDETERMINATE execution with hostile recorded input (escape path, unparsable JSON, schema-violating shape) never produces a settled conclusion, a re-execution, or a filesystem effect — recovery pauses honestly"
    - bash without its capability is rejected before ToolStarted even when other write capabilities are granted
    - "reconcile never widens what it may look at: policy-rejected paths produce no stat/read outside the root"
  artifacts: 
    - packages/tools-local/src/write-tools.ts
    - tests/security/path-escape.runtime.security.test.ts
    - tests/security/tools-local-write.security.test.ts
    - docs/subsystems/tools-local.md
falsified_if: "Any bypass attempt reaches the filesystem outside the root or executes without its capability, any policy-rejected or unobservable reconcile outcome is recorded as failed (provably-absent), any adversarial path auto-retries or re-executes, or any security property depends on the model behaving."
requires_adr: false
requires_human_acceptance: true
notes: "Composition-focused by design: each layer already has unit matrices (T002 capability, T003 path policy); this task proves the layers compose under attack and closes the one epistemic hole the composition exposes. The reconcile fix deliberately makes recovery pause more often (symlink races become human decisions) — that is the section 17 law working as intended, not a regression."
