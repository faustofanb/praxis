  scope_notes: 
    - "The reconcile outcome-matrix change is a bug fix against the documented ReconciliationOutcome contract, not a law change: contracts tool.ts already defines failed as provable-never-happened and verification-only reconciliation. No ADR needed (requires_adr false); risk D routes acceptance to human regardless."
    - Updating the T003 escape-reconcile security expectation from failed to indeterminate is part of the same correction and is called out in the contract so the reviewer sees the test law change explicitly.
    - "Authorization timing (decided once at proposal time, no mid-flight lease re-check between ToolAuthorized and ToolStarted) is out of scope: the appends are back-to-back in one in-process call and docs/02 section 9 places the decision at proposal. If the human wants a start-time re-check, that is a new task."
