schema_version: 1
id: M2-T004
title: implement minimal recoverable Agent Loop integration
milestone: M2
status: accepted
risk_class: C
objective: "Add the Model durable events (ModelRequestStarted, ModelResponseCompleted, ModelRequestFailed) plus the conversation fields needed to rebuild context from the stream (TurnStarted.input, ToolProposed.toolCallId, ToolDefinition.parametersJson), then implement runTurn in core: context projection from events, scripted-model step execution, tool dispatch through the M2-T003 executor, loop guards (max steps, consecutive model failures), and crash recovery that marks dangling executions honestly instead of assuming they never ran."
evidence: 
  observed: 
    - "docs/02 section 11 fixes the runTurn loop and section 6.2 defines the Model event vocabulary, but no Model events exist and nothing rebuilds conversation from the stream"
    - "M2 scenario acceptance requires user -> scripted model -> read_file -> model -> final, and process exit/resume without re-running historical tools; the pieces exist but are not integrated"
    - docs/02 section 17 forbids assuming a crashed tool never ran and forbids replaying historical tools; no recovery path exists
  expected: 
    - "docs/02 sections 6.2, 11, 16, 17 fix the vocabulary, loop sketch, single-writer serialization, and recovery steps"
    - "docs/03 M2 exit criteria: a session survives process exit and resumes from the Event Store"
  references: 
    - docs/02-system-design.md
    - docs/03-project-plan.md
    - .praxis/milestones/M2.yaml
hypothesis: "Projecting the conversation directly from durable events (TurnStarted.input as user message, ModelResponseCompleted as assistant turns, ToolSucceeded joined through ToolProposed.toolCallId as tool results) lets the same runTurn code start fresh turns and resume crashed ones; deterministic guards plus honest INDETERMINATE marking of dangling executions satisfy the M2 recovery scenario without re-executing anything."
scope: 
  allowed_paths: 
    - .praxis/tasks/M2-T004.yaml
    - .praxis/state.yaml
    - .praxis/handoffs/**
    - packages/contracts/**
    - packages/core/**
    - packages/tools-local/**
    - tests/**
    - docs/subsystems/**
    - package.json
    - bun.lock
  forbidden_paths: 
    - packages/provider-openai/**
    - packages/store-sqlite/**
    - packages/testkit/**
    - apps/**
architecture_refs: 
  - docs/02-system-design.md
required_gates: 
  []
acceptance: 
  scenarios: 
    - a fresh turn completes the M2 vertical: "user input, scripted model tool call, read_file execution, final model text, TurnCompleted"
    - "after a simulated process exit mid-turn, reopening the store and calling runTurn resumes the open turn from the replayed projection without re-running historical tool executions"
    - the conversation projected from events feeds buildContext and round-trips through ModelRequestSchema
  failure_cases: 
    - "a dangling EXECUTING execution from a crash is marked INDETERMINATE on recovery, never silently retried or assumed unexecuted"
    - a dangling PROPOSED/AUTHORIZED execution (provably never started) is closed with an explicit abandonment reason
    - exceeding max steps or consecutive model failures pauses the loop outcome instead of looping forever
    - a providerError stream appends ModelRequestFailed with the normalized kind and respects the failure guard
    - a cancelled stream records the attempt honestly and stops
    - "Model events outside an open turn, or responses without a pending request, are rejected by the reducer"
  artifacts: 
    - tests/model-events.test.ts
    - tests/reducer-model.test.ts
    - tests/agent-loop.test.ts
    - tests/integration/agent-loop-recovery.integration.test.ts
    - .praxis/handoffs/ generated by ai:handoff
falsified_if: "Resuming requires re-executing tools, conversation cannot be rebuilt from events alone, guards depend on a clock, or dangling executions must be coerced to a fabricated terminal state."
requires_adr: false
requires_human_acceptance: false