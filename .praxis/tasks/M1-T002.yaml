schema_version: 1
id: M1-T002
title: implement deterministic reducer and illegal transition checks
milestone: M1
status: accepted
risk_class: C
objective: "Implement the v1 StateReducer in packages/core per docs/02 section 7: a pure reduce(state, event) function over the Session/Turn event slice, deriving status/headSeq/currentTurnId, with explicit illegal-transition checks and stream-continuity enforcement, covered by unit, property, and integration tests."
evidence: 
  observed: 
    - "packages/core/src/index.ts is a stub exporting only manifest constants; no reducer, no derived state, no tests"
    - "the core-behavior quality rule requires unit, integration, and build gates, but no mise test:integration task exists yet"
  expected: 
    - docs/02 section 7 fixes reduce as a pure function and the minimum DerivedSessionState shape
    - docs/02 section 6.2 fixes the v1 Session/Turn vocabulary; ADR-0009 assigns transition legality to the Core reducer
  references: 
    - docs/02-system-design.md
    - docs/decisions/ADR-0009-session-event-contracts-v1.md
    - .praxis/milestones/M1.yaml
hypothesis: "A single pure reducer with an explicit initial state and fail-closed transition table covers the v1 Session/Turn lifecycle, keeps replay deterministic, and catches stream corruption (gaps, duplicate creation, cross-turn completion) without any I/O."
scope: 
  allowed_paths: 
    - .praxis/tasks/M1-T002.yaml
    - .praxis/state.yaml
    - .praxis/handoffs/**
    - packages/core/**
    - tests/**
    - package.json
    - bun.lock
    - mise.toml
    - docs/subsystems/**
  forbidden_paths: 
    - packages/contracts/**
    - packages/store-sqlite/**
    - apps/**
architecture_refs: 
  - docs/02-system-design.md
required_gates: 
  []
acceptance: 
  scenarios: 
    - fold a full Session/Turn lifecycle event stream and get the expected derived state; replaying the same stream yields an identical state
    - reducer output after each event is a pure function of the prior state and that event only
  failure_cases: 
    - event arriving on an EMPTY stream that is not SessionCreated is rejected
    - "duplicate SessionCreated, resume of a non-paused session, pause/complete with an open turn, or completing a foreign turn id is rejected"
    - an event whose seq is not exactly headSeq+1 is rejected (gap or replayed old event)
  artifacts: 
    - tests/reducer.test.ts
    - tests/property/reducer.property.test.ts
    - tests/integration/session-reducer.integration.test.ts
    - .praxis/handoffs/ generated by ai:handoff
falsified_if: "The reducer needs I/O, time, or randomness to decide a transition, or a legal v1 event stream exists that it rejects, or an illegal one it accepts."
requires_adr: false
requires_human_acceptance: false