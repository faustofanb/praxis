schema_version: 1
id: M1-T003
title: implement SQLite EventStore append load and replay
milestone: M1
status: acceptance_ready
risk_class: E
objective: "Implement the local SQLite EventStore adapter in packages/store-sqlite per docs/02 section 6.3 and ADR-0003: monotonic explicit migrations, transactional append with optimistic concurrency and (session_id, seq) uniqueness, readStream with schema validation on read, append-only with no UPDATE/DELETE event API, covered by a Bun-native store test suite."
evidence: 
  observed: 
    - "packages/store-sqlite/src/index.ts is a stub exporting only manifest constants; no schema, migrations, or store exist"
    - "the vitest suite runs under Node where bun:sqlite is unavailable, so store tests need the Bun-native test runner"
    - the store quality rule requires gates that do not all exist as mise tasks yet
  expected: 
    - "docs/02 section 6.3 freezes the sessions/events schema, UNIQUE(session_id, seq), and head_seq-as-cache-updated-in-the-same-transaction"
    - docs/01 freezes bun:sqlite (bundled with Bun 1.3.14) as the only SQLite channel; no ORM
    - ADR-0003 fixes append-only durability and replay as the truth model
  references: 
    - docs/02-system-design.md
    - docs/01-technical-baseline.md
    - docs/decisions/ADR-0003-event-store.md
    - .praxis/milestones/M1.yaml
hypothesis: "A single-user local SQLite adapter with explicit versioned migrations and one transaction per append satisfies the EventStore port contract (atomicity, uniqueness, gap-free seq, optimistic concurrency) while staying replay-safe; Bun-native tests via mise test:store exercise it without forcing the whole vitest suite onto the Bun runtime."
scope: 
  allowed_paths: 
    - .praxis/tasks/M1-T003.yaml
    - .praxis/state.yaml
    - .praxis/quality-gates.yaml
    - .praxis/handoffs/**
    - packages/store-sqlite/**
    - tests/**
    - package.json
    - bun.lock
    - mise.toml
    - vitest.config.ts
    - docs/subsystems/**
  forbidden_paths: 
    - packages/contracts/**
    - packages/core/**
    - apps/**
architecture_refs: 
  - docs/02-system-design.md
required_gates: 
  []
acceptance: 
  scenarios: 
    - "append a full lifecycle stream in batches with correct expectedHeadSeq progression, read it back, and fold it through the core reducer to the same state as before close"
    - reopening a database re-runs no migration and replays identical events
  failure_cases: 
    - append with a stale expectedHeadSeq throws EventStoreConflictError and writes nothing
    - a batch with a seq gap is rejected atomically (no partial rows)
    - "corrupted rows (bad actor JSON, unknown event type) fail schema validation on read instead of coercing"
    - no UPDATE or DELETE path for events exists in the public API
  artifacts: 
    - tests/store/store-sqlite.bun.test.ts
    - packages/store-sqlite/src/**
    - .praxis/handoffs/ generated by ai:handoff
falsified_if: "The adapter needs an ORM or new dependency, breaks append-only, can lose a committed batch, accepts a stream with gaps or duplicate seqs, or cannot round-trip events through the public contracts schema."
requires_adr: false
requires_human_acceptance: false