schema_version: 1
id: M0-T003
title: wire AI development control plane commands and schema validation
milestone: M0
status: accepted
risk_class: B
objective: "Make the AI development control plane operational: expose the seven ai:* commands as real mise tasks, enforce the full Task Contract schema in the controller, add controller tests, implement the architecture conformance gate, and add the three control-plane skills."
evidence: 
  observed: 
    - "mise.toml defines no ai:* tasks; scripts/ai/praxis-dev.ts is not invoked by any task, hook, or CI job"
    - "M0 machine gates (format/lint/typecheck/unit/build/knip) reference test:unit and build, which do not exist as mise tasks"
    - scripts/ai/README.md declares the controller must be made executable and tested during M0
    - scripts/ai/check-architecture.ts is a stub; docs/07 section 5 requires a test:architecture gate inside check:all for M0
    - "praxis-dev.ts validates only a subset of .praxis/schemas/task.schema.json (no id pattern, status/risk enum, or field shape checks) and has no tests"
  expected: 
    - "docs/06 section 13 target repo shape with ai:status/brief/plan/guard/verify/accept/handoff exposed via mise, executable and tested"
    - Task Contracts are validated against the schema contract before entering PLAN_READY
  references: 
    - docs/06-ai-development-control-plane.md
    - docs/07-architecture-conformance.md
    - scripts/ai/README.md
    - .praxis/backlog.yaml
hypothesis: "Thin mise task wrappers around scripts/ai/praxis-dev.ts plus in-repo schema validation and subprocess tests satisfy the M0 deliverable \"AI control plane commands\" without adding any third-party dependency."
scope: 
  allowed_paths: 
    - .praxis/tasks/M0-T003.yaml
    - .praxis/state.yaml
    - .praxis/quality-gates.yaml
    - .praxis/handoffs/**
    - mise.toml
    - mise.lock
    - package.json
    - bun.lock
    - tsconfig.json
    - knip.json
    - scripts/ai/**
    - tests/**
    - .agents/skills/execute-task/SKILL.md
    - .agents/skills/milestone-acceptance/SKILL.md
    - .agents/skills/architecture-change/SKILL.md
  forbidden_paths: 
    - packages/**
    - apps/**
architecture_refs: 
  - docs/07-architecture-conformance.md
required_gates: 
  []
acceptance: 
  scenarios: 
    - ai:plan/guard/verify/accept/handoff drive a task end to end on this repository via mise
    - schema validation rejects a Task Contract that violates .praxis/schemas/task.schema.json before PLAN_READY
  failure_cases: 
    - "invalid Task Contract (bad id pattern, bad risk_class, missing scope) is rejected by ai:plan"
    - a git change outside allowed_paths fails ai:guard
    - "a failing gate records FAIL, moves state to REWORK, and blocks ai:accept"
  artifacts: 
    - tests/praxis-dev.test.ts
    - .praxis/handoffs/ generated by ai:handoff
falsified_if: "ai:verify can pass while a required gate command is missing from mise, or ai:plan accepts a contract violating the task schema, or ai:guard passes with changes outside allowed_paths."
requires_adr: false
requires_human_acceptance: false