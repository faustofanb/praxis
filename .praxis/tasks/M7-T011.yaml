acceptance: 
  scenarios: 
    - "integration test: deps with providerOptions => provider-visible ModelRequest.providerOptions deep-equals; deps without => field absent"
    - "full gates green; all 59 existing test files unaffected (zero-change identity)"
    - "eval runner accepts PRAXIS_EVAL_PROVIDER_OPTIONS JSON (harness tests still pass without it set)"
  failure_cases: 
    - "providerOptions influencing reducer/recovery/capability behavior in any way (it must not — it rides the request only)"
    - "the field being required or defaulted (optional + absent-means-unchanged only)"
    - "an edit to contracts/provider-openai to 'fix' the passthrough (their half already works)"
  artifacts: 
    - packages/core/src/agent-loop/run-turn.ts (deps field + spread)
    - tests/integration/provider-options.integration.test.ts
    - evals/development-models/run-eval.ts (env parse) + README row
falsified_if: "The passthrough cannot be added without touching contracts or provider-openai (it can — both halves already exist), or the change breaks the zero-extension/zero-change identity in any existing test."
