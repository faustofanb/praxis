  scope_notes: 
    - "No contracts change and no ADR: ContextBudget is core-internal and no durable event changes; the law is recorded in docs/02 section 12 (ADR territory starts at durable-contract changes per docs/07 section 4)."
    - "run-turn.ts and reducer are deliberately forbidden: projectEpistemicBrief(state, budget) keeps its signature so the loop inherits the law without edits; if implementation evidence contradicts this, amend the contract first."
    - "The brief-less buildContext path must stay byte-identical to v0 (M4-T002 pin); only brief-present overflow changes, from silent truncation to fail-closed."
    - "The property budget arbitrary gains maxActiveHypotheses — an extension, not a relaxation; all existing pinned properties (never-exceeds-caps, preserved-suffix, determinism) must still hold."
    - "Amended during implementation: compactable sections evict as WHOLE sections (header + lines), not line-granular, so a section header can never dangle without content; later compactable sections are still evaluated after an earlier one fails (order stable, smaller sections may survive). Consequence recorded in docs/02 section 12.4: a line needing per-line truncation occupies ~cap bytes by itself, so it can never coexist with the fixed tier inside one fragment cap — the pre-M5 test 'caps a pathological observation line without evicting later sections' was rewritten to the new mechanism (whole-section eviction with an honest omission count, replacing truncated-into-view). Its invariant — pathological content cannot evict fixed sections — is preserved and strengthened; this is a mechanism change, not a weakening."
architecture_refs: 
  - .praxis/architecture.yaml
  - docs/02-system-design.md
required_gates: 
  - unit
  - integration
  - property
  - build
acceptance: 
  scenarios: 
    - "hypothesis flood: a folded state with many more active hypotheses than maxActiveHypotheses renders a brief containing the newest maxActiveHypotheses, an honest omission count, and every non-compactable section (goal+constraints, active plan, open challenges, completion block, pending indeterminate, latest verification); total brief bytes stay within maxFragmentBytes"
    - "runTurn integration (ScriptedModel): the flood under the default budget still delivers the system brief with the goal and omission marker to the model; a tiny budget whose non-compactable tier alone cannot fit fails closed with ContextBudgetExceededError before any ModelRequestStarted fact is appended"
    - validateContextBudget rejects non-positive and non-integer maxActiveHypotheses; DEFAULT_CONTEXT_BUDGET.maxActiveHypotheses is 8
    - brief-present composed system overflow throws ContextBudgetExceededError while the brief-less path keeps exact v0 truncation behavior (existing tests unmodified)
  failure_cases: 
    - "count pressure must not evict non-compactable sections: a brief that dropped '## Pending indeterminate action' or challenge lines to fit hypotheses/observations would silently hide governance state — rejected by adversarial tests"
    - silently tail-truncating the composed system fragment when a brief is present could hide a completion-blocking challenge — now fail-closed; a regression to silent truncation must fail the new builder test
    - "weakening existing pinned tests (property never-exceeds-caps / preserved-suffix / determinism, v0 byte identity, per-line cap) to make the change pass is forbidden"
  artifacts: 
    - packages/core/src/context/budget.ts
    - packages/core/src/context/builder.ts
    - packages/core/src/context/epistemic-brief.ts
    - tests/context-builder.test.ts
    - tests/context-epistemic.test.ts
    - tests/property/context-builder.property.test.ts
    - tests/integration/epistemic-context.integration.test.ts
    - docs/02-system-design.md
    - docs/03-project-plan.md
    - docs/subsystems/core.md
falsified_if: "The tiered assembly cannot be implemented without touching run-turn, the reducer, or contracts; existing pinned tests must be weakened to pass; the brief cannot both bound its total bytes and retain every non-compactable section under adversarial counts; or the brief-less projection stops being byte-identical to v0."
requires_adr: false
requires_human_acceptance: true
notes: "Risk C per backlog (core behavior over settled runtime; no contract change). Reaches ACCEPTANCE_READY; human sign-off required per ai-policy. Deferred to M5-T002: deterministic conversation summarization/compaction and the 1000-turn bounded-session proof. Deferred beyond v1: tool-result artifact/reference truncation markers, semantic retrieval."