hypothesis: "The provider adapter can honor at-most-once event delivery under its own retry: a retryable failure discards the attempt ONLY while nothing has escaped to the consumer; after any escape the failure is surfaced as one terminal providerError and core's existing failure path (honest ModelRequestFailed durable fact, §17 recovery) handles the rest. If pinning this law reveals a CORE inability to land mid-stream failures honestly (no ModelRequestFailed, or a completed fact emitted anyway), that is a Core correctness defect — evidence and a new contract, never an in-scope core patch. The §18 confinement law is expected to hold as-is (key is constructor-held, header-only) — the suite pins it against future regressions."
