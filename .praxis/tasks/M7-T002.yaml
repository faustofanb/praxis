acceptance: 
  scenarios: 
    - "mid-body connection reset AFTER delivered deltas: consumer sees the escaped deltas then exactly ONE terminal providerError(network, retryable); fetch called exactly once; core runTurn lands honest ModelRequestFailed with zero ModelResponseCompleted; no durable fact contains doubled text or a phantom tool call"
    - "half-built tool call then mid-stream reset: no retry, no completed, no second toolCallStart — the half-built call is never completed"
    - "abort during the backoff sleep (pre-escape retryable failure): stream ends silently, no further fetch attempt"
    - "retryable then non-retryable downgrade (429 → 401): retrying stops at the downgrade, one terminal providerError(auth, non-retryable), no third fetch"
    - "secret confinement: apiKey absent from the serialized wire body (and present in the Authorization header — control), from every durable event of a full real-adapter runTurn, and from model request messages"
  failure_cases: 
    - "the consumer receiving events from TWO attempts of one logical request (duplicated deltas / phantom half-built call) — the pre-fix P0, must fail the suite before the fix and pass after"
    - "a mid-escape providerError being swallowed silently (no terminal event, stream just ends — core would read endedSilently)"
    - an existing tests/provider-openai unit case failing after the fix (pre-escape retry semantics regressed)
    - "the apiKey discoverable anywhere in wire body, durable events, or model context"
    - "the fault/security suites weakening, duplicating, or restating existing suites instead of adding the two documented boundaries"
  artifacts: 
