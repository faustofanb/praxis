objective: "Close .praxis/backlog.yaml M7-T002 (risk D, prerequisites [M6] — accepted 2026-08-30) and the two docs/03 M7 quality-gate rows 'fault injection suite' and 'security bypass suite'. Observed state: the §17 crash matrix is fully embodied (tests/fault/crash-matrix.fault.test.ts, M5-T004) and agent-loop/tool-runtime/extension faults plus the capability/extension/bash security adversarial suites exist — but two DOCUMENTED boundaries have no fault/security-gate coverage. (1) Provider fault boundary (docs/02 §10 'adapter 负责 provider retry，Core 只处理规范化失败'; docs/subsystems/provider-openai.md retry table): covered only by UNIT-gate tests (tests/provider-openai/chat-provider.test.ts) whose injected failures all occur BEFORE any model event escapes (fetch throw, HTTP status, hanging fetch). GAP ANALYSIS FOUND A REPRODUCED P0: packages/provider-openai/src/chat-provider.ts streamWithRetry retries a retryable failure even when the failed attempt has already yielded events to the consumer — a mid-body connection reset after delivered deltas (pull-based ReadableStream erroring on a later read, repro at bun /tmp/praxis-repro/duplicate-deltas.ts) produces consumer sequence [textDelta 'hel', textDelta 'lo', textDelta 'hello', textDelta ' world', completed], so core consumeModelStream (packages/core/src/agent-loop/run-turn.ts:464 accumulates text += chunk.text across the WHOLE stream) assembles ModelResponseCompleted.text = 'hellohello world' — a corrupted durable fact (docs/03 §13 P0 状态失真); the tool-call variant is worse: a half-built call leaked across a retry under a fresh provider id enters the completed result as a PHANTOM write_file call with truncated argumentsJson '{\"path\":\"a' (potential duplicate/corrupt side effect). Also untested compositions: abort during the backoff sleep (must not fire a further fetch and must end silently), retryable-then-non-retryable downgrade (429 then 401 on retry: stop, surface auth, no third attempt), malformed stream after partial tool-call fragments (must never complete the half-built call). (2) Secrets law (docs/02 §18 'API key 不写入 config/event/model context；telemetry 必须 redaction'; provider-openai.md 'key 只进请求头'): no test PINS confinement — nothing asserts the key is absent from the wire body, from durable events of a real runTurn, or from model context. Deliverable: (a) MINIMAL adapter fix in packages/provider-openai/src/chat-provider.ts: retry only while NO event of the current attempt has escaped to the consumer (track yielded events per attempt; on a retryable providerError after an escape, yield the providerError as terminal instead of restarting — once anything is delivered the stream can never be replayed honestly); (b) tests/fault/provider-adapter.fault.test.ts: adapter-level matrix — mid-stream reset after text deltas escaped → exactly one fetch, terminal providerError(network, retryable), no duplicated deltas; half-built tool call then reset → no retry, no completed, no second toolCallStart; abort during backoff → silent end, no further fetch; 429-then-401 downgrade → stops retrying, surfaces auth non-retryable — plus one end-to-end runTurn case (real OpenAIChatProvider via injectable fetch in the tests/fault/agent-loop.fault.test.ts faultDeps pattern): mid-stream reset after deltas → durable stream ends in honest ModelRequestFailed, ZERO ModelResponseCompleted, appended facts never contain doubled text or a phantom call; (c) tests/security/secret-confinement.security.test.ts: §18 confinement with a deep-search over serialized JSON — wire body of the real adapter request contains the key nowhere (control: it IS in the Authorization header), every durable event of a full real-adapter turn is key-free, model request messages are key-free; (d) owning docs in the same change: docs/02 §10 principle sentence (the escape law: adapter may discard an attempt only before any of its events reached the consumer), docs/subsystems/provider-openai.md retry section + test entries, docs/03 M7 row ticks with provenance, .praxis/quality-gates.yaml provider rule gains fault+security gates."
