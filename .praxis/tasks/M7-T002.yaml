    - "NOT a test-only task: the gap analysis reproduced a P0 (durable-fact corruption via duplicated deltas / phantom tool call across an adapter retry). docs/03 §13 puts P0 fixes first; shipping the fault suite with a known-corrupt behavior unpinned (or pinned as 'expected') would be dishonest. The adapter fix is therefore IN scope, minimal, and confined to the retry loop's escape tracking — scope expansion from test-only to fix+tests is recorded here per AGENTS.md ('explain why before expanding')"
    - "packages/provider-openai/src/chat-provider.ts is the ONLY production file allowed; tests/security/** and tests/fault/* existing files are forbidden (the two new suite files are additions, not edits) — existing suites are never weakened; tests/provider-openai/chat-provider.test.ts stays byte-identical (the fix must keep its pre-escape retry cases green)"
