falsified_if: "Pinning the escape law requires weakening or editing any existing test (esp. tests/provider-openai/chat-provider.test.ts pre-escape retry cases) — the law and the unit suite must coexist, a conflict stops the task for re-planning. A runTurn-level inability to land a mid-stream providerError honestly (no ModelRequestFailed durable fact, or a completed fact emitted from partial deltas) is a CORE defect outside this contract's allowed paths — stop, record evidence, open a new contract. The fix touching anything beyond the retry loop's escape decision (wire mapping, classification, timeout, abort semantics) also falsifies the minimal-fix claim."
requires_adr: false
requires_human_acceptance: true
notes: "Risk D per backlog (security-adjacent behavior fix + adversarial suites): requires_human_acceptance TRUE — accept() must land ACCEPTANCE_READY and the implementing AI stops for human sign-off. No ADR: ADR-0010 already decides the adapter owns provider retry; this fix tightens that decision's safety law (documented in docs/02 §10, the owning doc) without changing the port, dependency direction, or decision structure. The repro script lives outside the repo (/tmp/praxis-repro) — the fault suite itself is the durable evidence. Existing 5 fault suites and all security suites stay untouched (one fact, one home); M7-T003 soak builds on this hardened boundary."