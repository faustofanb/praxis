schema_version: 1
id: M2-T001
title: define ModelProvider and ScriptedModel with cancellation
milestone: M2
status: acceptance_ready
risk_class: B
objective: "Define the v1 ModelProvider contract in packages/contracts per ADR-0010 (ModelRequest, ModelEvent stream vocabulary, normalized provider errors, AbortSignal cancellation semantics) and implement the deterministic ScriptedModelProvider in packages/testkit with script order, request recording, script-exhaustion failure, and cancellation/error injection, covered by unit tests."
evidence: 
  observed: 
    - "packages/contracts has no model boundary: the ModelProvider port promised by docs/02 section 4.1 does not exist"
    - "packages/testkit is a stub; no deterministic model exists, so no correctness gate can avoid a real LLM (an M2 forbidden work)"
    - "M2 failure acceptance requires explicit provider cancellation/timeout handling, which needs contract-level semantics"
  expected: 
    - "docs/02 section 10 fixes complete(request, signal) -> AsyncIterable<ModelEvent> and the minimal request/event sets"
    - docs/02 section 22 fixes the layered error taxonomy; ADR-0010 freezes the v1 TS/zod shape and cancellation-not-an-exception rule
  references: 
    - docs/02-system-design.md
    - docs/decisions/ADR-0010-model-provider-contract-v1.md
    - .praxis/milestones/M2.yaml
hypothesis: "A single async-iterable port with a small discriminated stream-event vocabulary, normalized error events, and silent-on-abort iterators gives Core a deterministic, testable model boundary; a script-driven provider with no clock or randomness suffices for all M2 correctness gates."
scope: 
  allowed_paths: 
    - .praxis/tasks/M2-T001.yaml
    - .praxis/state.yaml
    - .praxis/handoffs/**
    - packages/contracts/**
    - packages/testkit/**
    - tests/**
    - package.json
    - bun.lock
    - docs/decisions/ADR-0010-model-provider-contract-v1.md
    - docs/subsystems/**
  forbidden_paths: 
    - packages/core/**
    - packages/provider-openai/**
    - packages/tools-local/**
    - packages/store-sqlite/**
    - apps/**
architecture_refs: 
  - docs/02-system-design.md
  - docs/decisions/ADR-0010-model-provider-contract-v1.md
required_gates: 
  []
acceptance: 
  scenarios: 
    - a scripted provider streams its script in order to a consumer loop and records the requests it served
    - aborting before consumption yields an empty stream without throwing; aborting mid-script (waitForAbort) ends the stream quietly with no completed event
  failure_cases: 
    - requests failing schema validation are rejected by the owning zod schemas
    - consuming beyond the script end throws an explicit testkit invariant error
    - a providerError script item surfaces as a providerError event with normalized kind and retryable flag
    - unknown ModelEvent types are rejected by the union
  artifacts: 
    - tests/model-provider.test.ts
    - tests/testkit-scripted-model.test.ts
    - .praxis/handoffs/ generated by ai:handoff
falsified_if: "Cancellation cannot be exercised deterministically without a clock, the port forces Core to parse provider-specific shapes, or ScriptedModelProvider needs randomness or real I/O to behave."
requires_adr: true
requires_human_acceptance: false