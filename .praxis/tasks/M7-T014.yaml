falsified_if: "The widening cannot be justified by the runtime law — i.e. the law really does forbid investigation while an effect is unresolved (it does not: read-only investigation is legal at the runtime level; only coercion and ignoring are violations). Also falsified if the harness tests break (expectedActions[0] unchanged, so they must not)."
requires_adr: false
requires_human_acceptance: false
notes: "Risk A per backlog authoring (one row's expected set + one law string + one README row; zero production code). Operator authorization: '继续' on the v2 finding that explicitly asked for the nod. Matrix v3: the last open eval-design finding is closed — both former 0/5 rows now grade runtime laws (v2 anchored descriptions for healthy-plan; v3 unknown-faithfulness here)."
