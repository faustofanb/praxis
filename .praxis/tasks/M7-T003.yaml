schema_version: 1
id: M7-T003
title: run 10k+ synthetic turn soak and bounded-growth analysis
milestone: M7
status: accepted
risk_class: C
objective: "Close .praxis/backlog.yaml M7-T003 (risk C, prerequisites [M7-T001] — accepted 2026-08-30, its full-vocabulary shadow model and fold-resume law are the correctness foundation the soak stands on) and the docs/03 M7 quality-gate row 'soak 10k+ synthetic turns'. Observed state: the longest synthetic session anywhere in the suite is 1000 turns — tests/context-compaction.test.ts:111 (turnStarted/turnCompleted PAIRS only: no model requests, no tool executions, no epistemic events) and tests/integration/epistemic-context.integration.test.ts (1000-turn seed + 1 scripted turn). M7.yaml scenario_acceptance demands 'long-run no unbounded queues/state' and docs/02 §12's law 'Context is bounded working state, not the historical database' has never been exercised beyond 1k turns of the plainest traffic. Nothing pins: (a) that a 10,000-turn session mixing the FULL working vocabulary (model requests with text and tool calls, tool proposals/authorizations/executions with all terminal statuses, goal/observation/hypothesis/plan/challenge/verification traffic) folds legally end to end; (b) that the model context stays inside every DEFAULT_CONTEXT_BUDGET cap at arbitrary scale (messages ≤ 1+maxRecentMessages with honest dropped-count recap, estimatedTokens ≤ maxEstimatedTokens, epistemic brief composing without ContextBudgetExceededError); (c) that derived-state registries grow EXACTLY linearly with emitted facts (toolExecutions === executions proposed, turnIds === turns started, observations/hypotheses/plans/challenges === their emitted counts — no duplication, no superlinear structures); (d) that full-refold cost grows at most linearly with stream length across checkpoints (the practical soak tripwire). Deliverable: tests/soak/turn-soak.test.ts — a deterministic (modular-arithmetic patterned, zero-RNG) 10,000-turn synthetic session built with the @praxis/testkit session-event factories (~55-60k events: per turn TurnStarted/TurnCompleted around a model round-trip; every 3rd turn a full tool chain to SUCCEEDED/FAILED with every 25th replaced by a ToolRejected-from-PROPOSED path; periodic epistemic traffic — observations every 7th turn, hypothesis propose+support-state every 11th, plan supersede every 13th, challenge raise+resolve every 17th, verification every 23rd, GoalSet on turn 1), folded with foldSessionEvents at FIVE checkpoints (turns 2000/4000/6000/8000/10000, each a clean turn boundary) asserting at every checkpoint: headSeq === prefix length, status ACTIVE, no pending model request, no current turn, buildContext(projectConversation(state) + projectEpistemicBrief(state)) inside every budget cap with exact retained/dropped accounting, and registry sizes equal to the emitted counts; plus a final bounded-growth analysis test reporting the exact numbers (turns, events, context messages, dropped/retained split, brief presence) and a loose linearity tripwire (each checkpoint's full-refold duration within generous slack of the first checkpoint's — structural linear-growth counts are the deterministic proof, the timing guard is only a tripwire). Tick the docs/03 M7 row with provenance; docs/subsystems/core.md gains the soak test entry."
evidence: 
  observed: 
    - ".praxis/backlog.yaml M7-T003 (risk C, prerequisites [M7-T001] — accepted 2026-08-30); docs/03-project-plan.md M7 row 'soak 10k+ synthetic turns' unchecked; M7.yaml scenario_acceptance includes 'long-run no unbounded queues/state'"
    - "the largest existing synthetic sessions are 1000 turns of bare TurnStarted/TurnCompleted pairs (tests/context-compaction.test.ts:111 longSessionEvents) and a 1000-turn seed + 1 scripted turn (tests/integration/epistemic-context.integration.test.ts) — no model-request events, no tool executions, no epistemic mix, and an order of magnitude short of the 10k+ gate"
    - "packages/core/src/state/reducer.ts DerivedSessionState exposes the registries whose growth must be pinned (toolExecutions, turnIds, observations, hypotheses, plans, challenges, openChallenges, pendingModelRequest, currentTurnId); buildContext/projectConversation/projectEpistemicBrief + DEFAULT_CONTEXT_BUDGET (maxRecentMessages 64, maxEstimatedTokens 32k, fragment/observation/hypothesis caps) are the boundedness instruments, already exported from @praxis/core"
    - "packages/testkit/src/session-events.ts provides deterministic factories for the full working vocabulary with numeric id schemes, usable for a zero-RNG 10k-turn generator"
  expected: 
    - "tests/soak/turn-soak.test.ts (new): module-memoized deterministic stream builder + checkpoint folds; 10,000 turns, ~55-60k events; vitest's default include picks the file up in the existing unit gate — NO wiring changes"
    - "at each of the 5 checkpoints (turn boundaries 2000/4000/6000/8000/10000): fold succeeds, headSeq === count, status ACTIVE, no pending model request, no open turn; context messages ≤ 1 + 64 with dropped + retained === conversation length; estimatedTokens ≤ 32k; epistemic brief composes (no ContextBudgetExceededError) with hypotheses/observations sections bounded"
    - "registry linearity: toolExecutions.size === total chains proposed, turnIds.size === 10000, observations/hypotheses/plans/challenges sizes === their emitted counts; openChallenges empty at every checkpoint (all raised challenges resolve in-turn)"
    - "final analysis: exact deterministic numbers reported and asserted (total events, final message count 1+64, exact dropped count, brief present); linearity tripwire on refold durations with generous slack (deterministic structural counts carry the real proof)"
    - "docs/03-project-plan.md: '- [ ] soak 10k+ synthetic turns' → - [x] with (M7-T003: …) provenance"
    - "docs/subsystems/core.md: one test-entry line for the soak suite"
    - "NO changes under packages/**, apps/**, scripts/**; no new gate, no mise/package.json/vitest-config edits — the soak rides the existing include"
  references: 
    - docs/02-system-design.md
    - .praxis/milestones/M7.yaml
    - packages/core/src/state/reducer.ts
    - packages/core/src/context/budget.ts
    - tests/context-compaction.test.ts
    - tests/helpers/full-vocabulary-machine.ts
hypothesis: "The v1 kernel is genuinely soak-stable: a 10,000-turn full-vocabulary session folds legally at every checkpoint, the model context stays inside every budget cap with exact honest accounting, and every derived-state registry grows exactly linearly with emitted durable facts (context is the bounded working state; the event stream is the historical database — docs/02 §12). Any fold failure, budget violation, or registry count divergence is a Core correctness defect — evidence and a new contract, never an in-scope core patch."
