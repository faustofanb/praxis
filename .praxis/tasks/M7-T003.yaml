  scope_notes: 
    - "Test-only hardening task: the deliverable is a machine-verifiable soak; the unit gate running it on every check is the acceptance evidence. The soak rides the existing vitest include pattern — deliberately NO new gate/wiring, so .praxis/quality-gates.yaml, mise.toml, package.json, vitest.config.ts all stay untouched (the dependencies registry rule makes package.json/mise.toml edits human-acceptance events; a soak test file does not need them)"
    - "The 10k stream generator lives INSIDE the test file (like M5-T002's longSessionEvents, scaled and enriched) — tests/helpers is forbidden so the M7-T001 instrument and existing helpers cannot drift"
    - "If the soak proves too slow for the unit gate (>60s), splitting it into a dedicated gated task with wiring is a NEW decision (registry + mise + CI impact) — record evidence and stop, do not improvise wiring in-scope"
    - docs/03 tick + core.md entry are the owning-doc updates in the same change
architecture_refs: 
  - .praxis/architecture.yaml
  - docs/02-system-design.md
required_gates: 
  - unit
  - property
  - integration
  - replay
  - build
acceptance: 
  scenarios: 
    - "10,000-turn full-vocabulary synthetic session folds legally at all five turn-boundary checkpoints (headSeq continuity, ACTIVE status, clean turn/pending-model boundaries)"
    - "model context bounded at every checkpoint under DEFAULT_CONTEXT_BUDGET: ≤ 65 messages, tokens ≤ 32k, exact dropped/retained recap accounting, epistemic brief composed"
    - "derived-state registries grow exactly linearly: sizes equal emitted fact counts; openChallenges empty at checkpoints; no duplication or superlinear structure"
  failure_cases: 
    - foldSessionEvents throwing on any checkpoint of the legal synthetic stream (reducer defect)
    - buildContext exceeding any budget cap or throwing ContextBudgetExceededError on bounded-input composition at any checkpoint
    - any registry count diverging from emitted facts (duplication/leak) or recap accounting going dishonest at scale
    - the existing 1000-turn compaction test or any other suite needing changes for the soak to pass
  artifacts: 
    - tests/soak/turn-soak.test.ts
    - docs/03-project-plan.md M7 row tick
    - docs/subsystems/core.md test entry
falsified_if: "The soak surfaces a Core defect — fold failure on a legal stream, budget violation, or registry divergence — that is evidence for a new contract (any packages/core fix needs its own task and gates; schema changes would additionally trigger ADR). Making the soak pass by weakening context-compaction/property/example suites, by raising budgets, or by shrinking the vocabulary below the full working mix also falsifies the contract. Discovering the soak needs dedicated wiring (separate gate/CI config) to keep unit-gate latency sane stops the task for re-planning rather than improvising mise/package.json edits."
requires_adr: false
requires_human_acceptance: false
notes: "Risk C per backlog (test-only hardening over the M7-T001-proven transition laws; zero production code). requires_human_acceptance FALSE (precedent M7-T001/M6-T002/T003): the deliverable IS a machine-verifiable suite — gates passing is the acceptance evidence; M7 milestone promotion remains human-gated regardless (promotion_requires_independent_or_human_acceptance), and M7-T005 (real-model eval matrix, risk B, prereqs T002+T003) is the next human-visible checkpoint. The 'memory/context growth report' docs/03 row stays OUT of this task (soak numbers land in the handoff + test output; a dedicated report artifact belongs to milestone close-out if demanded)."