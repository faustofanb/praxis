    - "evals/development-models/scenarios.test.ts: 8-id pinned order; law-citation assertion; DECIDE_ACTIONS full-vocabulary coverage assertion; the per-scenario integrity loop (seed folds legally, expected non-empty and in vocabulary, brief markers non-empty) automatically covers the new rows"
    - "evals/development-models/BASELINE.md (new): matrix table + protocol + scoring rules + honest baseline status + recording procedure"
