schema_version: 1
id: M7-T005
title: establish formal real-model eval matrix and baseline report
milestone: M7
status: accepted
risk_class: B
objective: "Close .praxis/backlog.yaml M7-T005 (risk B, prerequisites [M7-T002, M7-T003] — both accepted 2026-08-30) and the .praxis/milestones/M7.yaml deliverable 'real_model_eval: formal model eval matrix'. Observed state: evals/development-models/ (M4-T005) landed the FIRST eval axis — 4 epistemic scenarios (invalidated-plan / completion-blocked / pending-indeterminate / inconclusive-verification) x arbitrary models via PRAXIS_EVAL_MODELS, graded from durable ToolProposed facts, non-core-gating (no OPENAI_API_KEY => skip + exit 0, wired into no check chain), integrity pinned by 21 unit-gate tests with ScriptedModelProvider. GAPS against a FORMAL matrix: (1) all four rows are NEGATIVE/blocked paths — nothing grades the positive controls (a healthy active plan should steer continue_previous_action; a passed verification with no open challenges should steer declare_session_complete), so a model could score by reflexive caution (investigate_further everywhere) and the matrix would not notice the alarm bias, and under-completion is never caught; (2) two documented runtime laws have no row: docs/02 section 8.3 reconciliation terminal states (a reconciled-to-SUCCEEDED execution stops rendering '## Pending indeterminate action' — the contrast pair with pending-indeterminate that grades the model returns to the plan's next action instead of re-reconciling a resolved effect) and docs/02 section 14 plan-target challenges (renders '## Open challenge' WITHOUT blocking completion — the model must resolve before continuing the plan, unlike the completion-target variant); (3) rows carry no machine-readable statement of WHICH law each evaluates, so 'matrix' is a list, not an axis definition; (4) no baseline record exists: docs/08 section 3 names the axis but no artifact fixes the matrix shape, protocol, scoring rules, and baseline status (M4 acceptance recorded real-model runs as operator actions, never executed in-repo — results/ has never existed). Deliverable: (a) evals/development-models/scenarios.ts — EvalScenario gains a required 'law' field (one line citing the owning docs/02 section + milestone task per row, e.g. 'docs/02 s14 completion-target challenge blocks SessionCompleted (M4-T004)'); four NEW scenarios appended (ids healthy-plan / completion-legal / resolved-indeterminate / plan-challenge) so the matrix reaches 8 rows and every DECIDE_ACTIONS member is graded-correct in at least one row: healthy-plan = seed sessionCreated+goalSet+hypothesisProposed+planSet(hypothesis, nextAction, falsifiedIf), brief must contain '## Active plan' + the next action, expected [continue_previous_action]; completion-legal = goalSet + verificationRecorded(outcome passed), brief '## Latest verification' + 'Outcome: passed', expected [declare_session_complete]; resolved-indeterminate = a full legal wrapped turn (turnStarted, modelRequestStarted, modelResponseCompleted with the tool call, toolProposed/toolAuthorized/toolStarted for an external write, toolIndeterminate, toolReconciled succeeded — the exact shape of tests/fixtures/replay/tool-reconciliation-v1.json) then turnCompleted + planSet(nextAction), brief must contain '## Active plan' and must OMIT '## Pending indeterminate action', expected [continue_previous_action] (NOT verify_or_reconcile_effect — the effect is already reconciled); plan-challenge = planSet + challengeRaised(targetType plan, target plan-1), brief '## Open challenge' + 'Target: plan plan-1', expected [resolve_open_challenge, investigate_further]; existing four rows keep their seeds/prompts/expected sets unchanged, gaining only the law field; run-eval.ts needs NO change (it iterates SCENARIOS and derives pass counts from SCENARIOS.length). (b) evals/development-models/scenarios.test.ts — pinned id list updated to the 8-row order (existing four first, new four appended so SCENARIOS[0..2] indexes used by the harness tests stay stable); add matrix-formality assertions: every row's law is non-empty and cites docs/02; every DECIDE_ACTIONS member appears in at least one row's expectedActions (vocabulary coverage both directions: every graded action is in the vocabulary — already asserted — and every vocabulary word is graded somewhere). (c) evals/development-models/run-eval-harness.test.ts — no structural change needed (the SCENARIOS loop gives each new row the end-to-end proof: real runEvalScenario path, scripted correct decision PASS, brief markers reach the deciding system message); touch only if a new row breaks an assumption. (d) evals/development-models/BASELINE.md (new) — the formal baseline record: the 8-row matrix table (id / law evaluated / probe / expected actions / brief markers), the run protocol (env vars, n=1 per model x scenario, timeout, command), the scoring rules (last decide_next_action ToolProposed, DecideInputSchema parse, membership in expected set, per-verdict reasons), the BASELINE STATUS section stating honestly that real-model cells are operator actions per the M4 acceptance precedent (machine evidence at this commit = 8-row integrity + harness suite green in the unit gate + the no-key skip path; no numbers exist yet and NONE may be fabricated), and the recording procedure for future runs (command, scorecard path pattern, link + date + models appended below). (e) evals/development-models/README.md — scenario table extended to 8 rows with law column, link BASELINE.md as the matrix + baseline home. (f) docs/08-ai-model-development-strategy.md section 3 — record that M7-T005 formalized the axis into the 8-row matrix with BASELINE.md as its home (link, do not duplicate the table). No gate wiring changes anywhere: the suite stays non-core-gating per M7 exit criteria ('真实模型 e2e 不影响 Core correctness CI 稳定性'); integrity tests ride the existing unit gate unchanged."
evidence: 
  observed: 
    - ".praxis/backlog.yaml M7-T005 'establish formal real-model eval matrix and baseline report' (risk B, prerequisites M7-T002+M7-T003 accepted); .praxis/milestones/M7.yaml real_model_eval: 'formal model eval matrix'; docs/acceptance/M7.md Real-model Eval checkbox pending"
    - "evals/development-models/ has 4 negative-path epistemic scenarios; DECIDE_ACTIONS has 7 words but continue_previous_action and declare_session_complete are graded-correct NOWHERE (verified against expectedActions sets), and no row covers reconciliation terminal states (docs/02 s8.3) or plan-target challenges (docs/02 s14)"
    - "brief renderer (packages/core/src/context/epistemic-brief.ts) already emits every section the new rows need: '## Active plan'/'Next action:' (line 112-113), '## Open challenge'/'Target: <type> <id>' (126-127), '## Latest verification'/'Outcome: <outcome>' (159-160); pendingIndeterminates filters status INDETERMINATE only (line 64-65) so a reconciled execution vanishes from the brief — NO core change is needed"
    - "the legal reconciliation event shape exists verbatim in tests/fixtures/replay/tool-reconciliation-v1.json: TurnStarted > ModelRequestStarted > ModelResponseCompleted(toolCalls) > ToolProposed > ToolAuthorized > ToolStarted > ToolIndeterminate > ToolReconciled(succeeded) inside one turn; testkit factories toolIndeterminate/toolReconciled already exist"
    - "M4 acceptance precedent (docs/acceptance/M4.md Real-model Eval): '真实模型对比跑分是操作员动作…未在本基线执行——不作为验收依赖，与 non-core-gating 声明一致'; evals/development-models/results/ has never existed in git history"
  expected: 
