hypothesis: "The runtime's existing durable-fact vocabulary and brief sections already suffice to grade the positive controls and the two uncovered laws — the matrix reaches 8 rows with full DECIDE_ACTIONS coverage and zero production-code changes, its integrity stays machine-pinned in the unit gate, and the baseline record is honest about real-model cells being operator actions. If a positive control turns out to be ungradeable without new brief sections or core behavior, the hypothesis falsifies and the work becomes a core task with its own contract."
