    - "run-eval-harness.test.ts is allowed_paths but expected to need at most index-stability verification: the SCENARIOS loop covers new rows for free; existing index-based tests ([0],[1],[2]) stay stable because new rows are APPENDED"
    - "docs/03 is forbidden ON PURPOSE: the M7 section has no eval row (the matrix is milestone-level, recorded in M7.yaml real_model_eval + docs/08 s3 + BASELINE.md — one fact, one home); milestone acceptance and the docs/acceptance/M7.md Real-model Eval checkbox are a separate human event"
    - "results/** is forbidden: generated scorecards are operator-run output; BASELINE.md links them but never fabricates them"
