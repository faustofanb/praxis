  - unit
  - property
  - integration
  - replay
  - build
acceptance: 
  scenarios: 
    - "8-row matrix integrity: every seed folds legally through foldSessionEvents; every expected action is in DECIDE_ACTIONS; every row cites a law referencing docs/02"
    - "full vocabulary coverage: each of the 7 DECIDE_ACTIONS words is graded-correct in at least one row's expectedActions (and the per-row membership direction was already pinned)"
    - "end-to-end harness per new row (real runEvalScenario path, ScriptedModelProvider): correct decision => verdict pass + turnOutcome completed; brief markers verified present/absent on the deciding request's system message — including resolved-indeterminate omitting '## Pending indeterminate action' and plan-challenge carrying 'Target: plan plan-1'"
    - "BASELINE.md renders the matrix, protocol, scoring rules, honest status, and recording procedure without inventing any real-model number"
  failure_cases: 
    - "a new scenario whose seed violates reducer preconditions (e.g. ToolProposed outside an open turn, or an unresolved indeterminate seeded at entry — which would SessionPaused before the model is consulted) fails the fold/harness tests"
    - a brief marker that never reaches the deciding model request fails the harness marker assertions
    - a DECIDE_ACTIONS word left ungraded by the whole matrix fails the coverage test
    - "wiring the real-model run into any check/gate chain, or editing the gates registry, is out of scope — M7 exit criteria require real-model e2e to never affect Core CI stability"
    - any fabricated real-model number in BASELINE.md falsifies the task outright
  artifacts: 
    - evals/development-models/scenarios.ts (8-row formal matrix with law field)
    - evals/development-models/scenarios.test.ts (matrix formality assertions)
    - evals/development-models/BASELINE.md (baseline record)
    - evals/development-models/README.md (matrix table + link)
    - docs/08-ai-model-development-strategy.md section 3 note
falsified_if: "A positive control or an uncovered law cannot be graded with the existing brief sections and durable vocabulary — i.e. establishing the row requires changing packages/** (new brief section, new event, new grading hook) or run-eval.ts/grader.ts logic — then this contract's zero-production-change hypothesis is falsified and the work must be re-scoped as a core task with its own contract and risk class. Likewise falsified if full DECIDE_ACTIONS coverage proves impossible without prompting the model toward an answer (scenario design law: legality must follow from the brief facts alone)."
requires_adr: false
requires_human_acceptance: false
notes: "Risk B per backlog (extends a non-gating evidence tool; no production code). requires_human_acceptance FALSE (precedent M7-T001/T003/T004): the integrity + harness suite green in the unit gate IS the acceptance evidence; the M7 milestone promotion and its real_model_eval checkbox stay human-gated regardless. Baseline honesty is the load-bearing rule: BASELINE.md records status, never invented numbers — real-model cells are operator actions exactly as the accepted M4 exit decision recorded. The A-E development-model axes (docs/08 s3.1) remain future work; this task formalizes the runtime-law axis only. Last M7 backlog task: after acceptance, remaining M7 docs/03 rows (coverage target, knip, memory report, sqlite policy, bun 1.4) have no backlog entries — they are milestone-level decisions for the human, not self-selected scope."