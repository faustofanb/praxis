acceptance: 
  scenarios: 
    - "standing instructions render as a capped '## Extension: standing-orders' section after the base prompt through the real host in runTurn deps, without any Core edit"
    - "a denied tool produces ToolRejected citing the extension, never ToolStarted/ToolSucceeded, and the turn completes — composed in one host with the telemetry observer, which counts it REJECTED"
    - "zero-config identity: a registered-but-unconfigured standing-orders extension leaves request and stream byte-identical to a bare run"
    - "unload stops both contributions immediately: the next turn's request carries no section and no deny fires"
  failure_cases: 
    - "bad configuration discovered at construction (whitespace instructions, blank tool names) — loud throw, never silent misbehavior mid-turn"
    - "the extension attempting anything besides deny/contribute — structurally absent (no observe hooks, no allow path)"
    - "mis-rendering or mis-capping — pinned by section-order assertion; budget law is M5-T001's and unchanged"
  artifacts: 
    - "packages/extension-standing-orders (package.json, tsconfig.json, src/index.ts, src/standing-orders.ts)"
    - registration: "root package.json line, bun.lock record, tsconfig reference, architecture.yaml entry"
    - tests/extensions/standing-orders.test.ts
    - docs/subsystems/extension-standing-orders.md + README row + docs/03 M6 tick
falsified_if: "A realistic operator-policy extension needs more than contributeContext/beforeTool (any Core edit falsifies the M6 'without core edit' scenario); or a fail_closed policy extension behaves differently under the M5-T001 composition law than an isolate one (it must not); or empty configuration cannot be byte-inert; or deny composition with a second registered extension miscounts/misorders."
requires_adr: false
requires_human_acceptance: false
notes: "Risk B per backlog (prerequisite M6-T001 accepted c605a82). No ADR: ADR-0013 owns the seam decisions; this task ships its second consumer and must not move any boundary. Machine acceptance per ai-policy for risk B. After this task M6 has both §19 failure-policy cells embodied in shipped code, which is exactly the surface M6-T004 (unload/failure isolation audit, risk C) needs."