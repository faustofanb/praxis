  scope_notes: 
    - "risk B: additive out-of-core package; 'without Core modification' enforced mechanically via forbidden_paths (packages/core/**, packages/contracts/**) — a seam gap stops the task for evidence rather than a Core patch"
    - "Registration paths (package.json devDependency line, bun.lock record, tsconfig reference, architecture.yaml tier1 entry) are allowed from the start this time — the M6-T002 lesson, recorded there as two scope amendments, is now budgeted as known cost, not a boundary move"
    - "fail_closed is the point of this sample: it embodies the OTHER cell of the §19 failure table (M6-T002 embodied isolate). Its crash-rides-§17 behavior is already pinned by M6-T001 fault tests; this task pins the declaration, not a new failure path"
    - The deny-list matches on tool NAME only; argument-aware policy (e.g. path prefixes) is deliberately out of scope for the sample and would not change the seam
    - Importing @praxis/extension-telemetry in the composition TEST is allowed use (dependency direction tests→packages); editing that package is not
architecture_refs: 
  - .praxis/architecture.yaml
  - docs/02-system-design.md
  - docs/decisions/ADR-0013-extension-seams-v1.md
required_gates: 
  - unit
  - integration
  - replay
  - fault
  - security
