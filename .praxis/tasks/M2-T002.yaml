schema_version: 1
id: M2-T002
title: implement bounded ContextBuilder v0
milestone: M2
status: accepted
risk_class: C
objective: "Implement the v0 deterministic ContextBuilder in packages/core per docs/02 section 12 and docs/03 M2.2: project a system fragment, user message, recent history window, and tool schemas into bounded ModelMessages under hard byte/token-estimate caps, with oldest-first dropping and head truncation markers. Pure and deterministic; no retrieval, no summarization, no I/O."
evidence: 
  observed: 
    - packages/core contains only the Session/Turn reducer; the agent loop pseudocode in docs/02 section 11 calls runtime.contextBuilder.build(state) but no context module exists
    - "M2 loop requests must be bounded, but nothing enforces max recent messages, max fragment bytes, or a token-estimate cap today"
    - docs/02 section 12.3 requires hard caps with deterministic truncation policy in v1; semantic retrieval is explicitly deferred
  expected: 
    - "docs/02 section 12.1/12.3 fixes the composition order (system, goal/conversation, tool schemas) and the v1 budget caps and overflow strategies"
    - "docs/03 M2.2 lists the v0 deliverables: system fragment, user message, recent history, tool schema, hard byte/token estimate cap"
  references: 
    - docs/02-system-design.md
    - docs/03-project-plan.md
    - .praxis/milestones/M2.yaml
hypothesis: "A pure function from (system prompt, conversation history, tool definitions, budget) to bounded ModelMessage[] with newest-window selection, per-fragment and tool-result byte truncation markers, and oldest-first dropping under a bytes/4 token estimate satisfies every M2 loop request need; the same input always yields the same context."
scope: 
  allowed_paths: 
    - .praxis/tasks/M2-T002.yaml
    - .praxis/state.yaml
    - .praxis/handoffs/**
    - packages/core/**
    - tests/**
    - docs/subsystems/**
    - package.json
    - bun.lock
  forbidden_paths: 
    - packages/contracts/**
    - packages/testkit/**
    - packages/provider-openai/**
    - packages/tools-local/**
    - packages/store-sqlite/**
    - apps/**
architecture_refs: 
  - docs/02-system-design.md
required_gates: 
  []
acceptance: 
  scenarios: 
    - "building a context yields system message first, the newest history window in original order, and passthrough tool schemas with a token estimate at or under the cap"
    - a tool result larger than maxToolResultBytes is head-truncated with an explicit byte marker and stays within cap
    - histories beyond the message or token caps drop the oldest entries first and never drop the trailing (current) message
    - the same input and budget always build the same output
  failure_cases: 
    - "a non-positive or non-integer budget cap is rejected up front, not silently ignored"
    - a system prompt plus trailing message that cannot fit the token cap fails with an explicit budget-exceeded error instead of an oversized request
    - truncation never produces invalid ModelMessage shapes (validated against the contracts schemas)
  artifacts: 
    - tests/context-builder.test.ts
    - tests/property/context-builder.property.test.ts
    - tests/integration/context-builder.integration.test.ts
    - .praxis/handoffs/ generated by ai:handoff
falsified_if: "Built contexts can exceed any declared cap, the projection depends on anything but its input (clock, randomness, environment), order is not preserved, or the M2 loop sketch cannot express its request through this builder."
requires_adr: false
requires_human_acceptance: false