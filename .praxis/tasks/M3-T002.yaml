acceptance: 
  scenarios: 
    - a tool with requiredCapability fs.read under a standing workspace grant is authorized and executes
    - a write capability covered by an unexpired lease is allowed; the same lease after expiresAt is denied unconditionally
    - "an approvable write capability without grant/lease yields requires_approval, which the runtime records as ToolRejected fail-closed with an explicit reason"
    - the policy summary projection renders grants and active leases (with expiry) deterministically for model-visible context
    - write-effect tool definitions without requiredCapability fail registration
  failure_cases: 
    - "scope escape is denied: '..' segments rejected at scope normalization; sibling-prefix roots (/work vs /workspace) never satisfy containment"
    - "expired lease never authorizes, and an unknown/ungranted capability is denied rather than ignored (fail closed)"
    - approval unavailability cannot open the gate — requires_approval always rejects at the v1 seam; the model cannot self-grant by re-proposing
    - read-only tools keep working unchanged (no requiredCapability required); existing replay fixtures still fold
  artifacts: 
    - tests/capability-policy.test.ts
    - tests/security/capability-policy.security.test.ts
    - tests/integration/capability-runtime.integration.test.ts
    - docs/subsystems/contracts.md
    - docs/subsystems/core.md
falsified_if: "Any capability check depends on prompt/model behavior, a lease outlives its expiresAt through any code path, approval unavailability allows execution, scope containment is syntactic rather than normalized, or write tools without declared capabilities can execute."
requires_adr: false
requires_human_acceptance: true
notes: "Deliberately deferred: write_file/bash tools and CLI lease flags/wiring (M3-T003), broader adversarial suite (M3-T005), OS-level sandbox (docs/02 section 9.3 — v1.1 direction, explicitly not claimed for v1). The requires_approval -> ToolRejected mapping is the fail-closed headless behavior; an approval extension later turns that request into a lease without touching the decision table."
