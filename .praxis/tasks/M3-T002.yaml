  scope_notes: 
    - "ADR-0007 already owns the capability-in-core decision; this task adds no new durable event semantics, so no new ADR (requires_adr false). Risk D routes acceptance to human regardless."
    - "ToolProposed payload stays unchanged: capability requirements are static tool metadata replayable from the registry; the stream records decisions (ToolAuthorized/ToolRejected) as it already does. Deliberate non-change, documented in notes."
