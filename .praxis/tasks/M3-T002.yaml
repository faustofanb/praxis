schema_version: 1
id: M3-T002
title: implement runtime capability policy and leases
milestone: M3
status: acceptance_ready
risk_class: D
objective: "Make docs/02 section 9 and ADR-0007 executable: capability requirements and scopes as contracts, a pure allow/deny/requires_approval decision table in core covering standing grants, time-bounded leases (expired = unconditional deny, never LLM judgment), and workspace scope containment; wire it into the tool runtime through the existing authorizer seam; enforce at registration that write-effect tools declare requiredCapability (fail closed — no prompt-only security); and expose a model-visible policy projection. Enforcement lives in Core; approval UX stays an extension and fails closed. No new tools — write_file/bash are M3-T003."
evidence: 
  observed: 
    - "packages/core/src/tools/tool-runtime.ts has only readOnlyAuthorizer (deny-by-default, read_only only) with ToolAuthorizer as the documented 'M3 capability seam'; nothing implements grants, leases, or requires_approval"
    - "ToolDefinition has no requiredCapability (deliberately deferred from M3-T001); docs/02 section 8.1 sketch includes requiredCapability?: CapabilityRequirement"
    - "docs/02 section 9.1-9.2 specifies CapabilityRequirement {name, scope?}, AuthorizationDecision allow(+lease)/deny/requires_approval, CapabilityLease {id, capability, scope, issuedAt, expiresAt, reason}; ADR-0007 requires fail-closed approval-unavailability and security tests for direct/delegated bypass, expired lease, scope escape, fail-open"
    - "M3 milestone scenario acceptance: 'expired capability cannot execute'; failure acceptance: 'path/capability bypass attempts rejected'; docs/03 M3.2 checklist: fs.read/fs.write/shell.exec, workspace scope, all three decisions, lease expiration, model-visible policy projection"
  expected: 
    - "contracts: CapabilityScope (workspace root, lexically normalized, '..' rejected), CapabilityRequirement, CapabilityGrant, CapabilityLease with branded CapabilityLeaseId and numeric issuedAt/expiresAt, ApprovalRequest, and the three-way CapabilityDecision (allow | deny+reason | requires_approval+request)"
    - "core: capabilityDecision(requirement, policy, now) — a pure total decision table: scope outside workspace roots -> deny; standing grant covering -> allow; unexpired lease covering -> allow; expired lease -> deny (never silently renewable); approvable capability without grant/lease -> requires_approval; anything else -> deny"
    - "core: capabilityAuthorizer maps decisions onto the existing ToolAuthorizationDecision seam; requires_approval rejects fail-closed with an explicit reason (ADR-0007) until an approval extension exists"
    - "core: validateToolDefinitions extends M3-T001 registration law — write-effect tools without requiredCapability are rejected; capability policy summary projection for model-visible context"
    - "security suite: bypass attempts (scope escape via '..' and sibling-prefix, expired lease, ungranted capability, fail-open attempts) all rejected"
  references: 
    - docs/02-system-design.md
    - docs/decisions/ADR-0007-capability-core.md
    - docs/03-project-plan.md
    - .praxis/milestones/M3.yaml
    - .praxis/tasks/M3-T001.yaml
hypothesis: "Capability enforcement closes as a pure decision table plus a thin adapter onto the existing authorizer seam: the runtime calls capabilityDecision before ToolAuthorized, never lets a lease past its expiresAt regardless of what the model or tool claims, and treats undeclared write capabilities as registration errors. Because decisions are facts already (ToolAuthorized/ToolRejected with reasons) and requirements are static tool metadata, no durable event vocabulary changes are needed."
