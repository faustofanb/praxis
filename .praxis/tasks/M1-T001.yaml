schema_version: 1
id: M1-T001
title: define ids event envelope and session/turn contracts
milestone: M1
status: accepted
accepted_by: 樊彪 (human)
accepted_at: 2026-08-27
risk_class: E
objective: "Implement the durable contract layer in packages/contracts per ADR-0009: branded IDs, the Zod-validated SessionEvent envelope, the Session/Turn event payloads, the tool execution status union, and the EventStore port, covered by unit and property tests."
evidence: 
  observed: 
    - "packages/contracts/src/index.ts is a 1-line placeholder; no schemas, ports, or tests exist"
    - M1 machine gates list property/replay/integration while only unit-adjanged gates exist as mise tasks
  expected: 
    - "docs/02 sections 6-8 define the envelope, invariants, vocabulary, tool status machine, and port semantics"
    - docs/01 technical baseline freezes zod at exact 4.4.3 as the only allowed contracts runtime dependency
  references: 
    - docs/02-system-design.md
    - docs/decisions/ADR-0009-session-event-contracts-v1.md
    - docs/decisions/ADR-0003-event-store.md
    - .praxis/milestones/M1.yaml
hypothesis: A single generic Zod-validated envelope plus per-event payload schemas and a discriminated union satisfies the M1 kernel needs and keeps the vocabulary extensible for M2-M4 without schema duplication.
scope: 
  allowed_paths: 
    - .praxis/tasks/M1-T001.yaml
    - .praxis/state.yaml
    - .praxis/quality-gates.yaml
    - .praxis/handoffs/**
    - packages/contracts/**
    - tests/**
    - package.json
    - bun.lock
    - mise.toml
    - docs/decisions/ADR-0009-session-event-contracts-v1.md
    - docs/subsystems/**
  forbidden_paths: 
    - packages/core/**
    - packages/store-sqlite/**
    - apps/**
architecture_refs: 
  - docs/02-system-design.md
  - docs/decisions/ADR-0009-session-event-contracts-v1.md
required_gates: 
  []
acceptance: 
  scenarios: 
    - external consumers parse a stored session/turn event stream through the public contracts API
  failure_cases: 
    - "envelope with non-positive seq, empty ids, or wrong payload shape fails schema validation"
    - branded ID wrappers reject empty strings
    - discriminated union rejects an unknown event type
  artifacts: 
    - tests/contracts-events.test.ts
    - tests/property/contracts-events.property.test.ts
    - .praxis/handoffs/ generated by ai:handoff
falsified_if: "A valid v1 event stream cannot round-trip through JSON and schema parsing losslessly, or the reducer-facing union cannot be made exhaustive, or zod cannot express the envelope without loosening the documented invariants."
requires_adr: true
requires_human_acceptance: false