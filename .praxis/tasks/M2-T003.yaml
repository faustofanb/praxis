schema_version: 1
id: M2-T003
title: implement read-only tool runtime and local read tools
milestone: M2
status: accepted
risk_class: C
objective: "Extend the durable vocabulary with the tool lifecycle events (ToolProposed -> ToolAuthorized/ToolRejected -> ToolStarted -> SUCCEEDED/FAILED/INDETERMINATE), project tool executions in the reducer, add a read-only tool runtime executor in core with a deny-by-default authorization hook, and implement read_file/list_dir in tools-local with byte-bounded output truncation and workspace-root confinement, enabling the fault and security gates."
evidence: 
  observed: 
    - contracts has no tool lifecycle events; the state machine in docs/02 section 8.2 exists only as the TOOL_EXECUTION_STATUSES string union
    - "docs/03 M2.3 requires ToolProposed -> authorization -> ToolStarted -> terminal plus read_file, list_dir, and output truncation; none exist"
    - "the tool-lifecycle quality rule requires integration, fault, and security gates, but test:fault and test:security are still reserved tasks in mise.toml"
  expected: 
    - docs/02 section 8.1 fixes ToolDefinition (name/description/inputSchema/effect/execute) and section 8.2 fixes the state machine and its hard rules
    - docs/02 section 7 lists toolExecutions among DerivedSessionState projections
    - "docs/03 M2.3 and M2.yaml fix the read-only scope: no writes, no multi-agent, denial must be explicit"
  references: 
    - docs/02-system-design.md
    - docs/03-project-plan.md
    - .praxis/milestones/M2.yaml
hypothesis: "Encoding the tool lifecycle as durable events driven by a core executor over injected ports keeps replay free of side effects, lets read-only failures map to FAILED deterministically while reserving INDETERMINATE for genuinely unknown external effects, and a workspace-root-confined read_file/list_dir pair with head truncation satisfies the M2 loop without any capability machinery beyond deny-by-default."
scope: 
  allowed_paths: 
    - .praxis/tasks/M2-T003.yaml
    - .praxis/state.yaml
    - .praxis/handoffs/**
    - packages/contracts/**
    - packages/core/**
    - packages/tools-local/**
    - tests/**
    - docs/subsystems/**
    - mise.toml
    - package.json
    - bun.lock
  forbidden_paths: 
    - packages/provider-openai/**
    - packages/store-sqlite/**
    - packages/testkit/**
    - apps/**
architecture_refs: 
  - docs/02-system-design.md
required_gates: 
  []
acceptance: 
  scenarios: 
    - a proposed read-only tool transitions PROPOSED -> AUTHORIZED -> EXECUTING -> SUCCEEDED with its result recorded as a durable event
    - read_file returns workspace files byte-bounded with a truncation marker; list_dir lists directory entries
    - replaying a stream containing tool events reconstructs the same toolExecutions projection without executing tools again
  failure_cases: 
    - a tool whose declared effect is not read_only is rejected before execution by the deny-by-default hook
    - malformed tool arguments fail schema validation before any execute call
    - a path escaping the workspace root fails the tool instead of reading outside it
    - "an execute that crashes mid-flight leaves the durable state machine recoverable (replay shows the true last state, no fabricated terminal)"
    - "an UNKNOWN external effect surfaces as INDETERMINATE, never coerced to FAILED"
    - "illegal lifecycle transitions (terminal resurrection, skips) are rejected by the reducer"
  artifacts: 
    - tests/tool-events.test.ts
    - tests/property/tool-events.property.test.ts
    - tests/reducer-tools.test.ts
    - tests/fault/tool-runtime.fault.test.ts
    - tests/security/tools-local.security.test.ts
    - tests/integration/tool-runtime.integration.test.ts
    - tests/fixtures/replay/session-tool-lifecycle-v1.json
    - .praxis/handoffs/ generated by ai:handoff
falsified_if: "Replay must execute tools to rebuild state, the executor needs provider or clock knowledge, INDETERMINATE cannot be represented, or read tools cannot be confined to the workspace root deterministically."
requires_adr: false
requires_human_acceptance: false