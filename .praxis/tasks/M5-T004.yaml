  scope_notes: 
    - "AMENDMENT (2026-08-29, pre-guard): added biome.json to allowed_paths. Evidence: the lint gate (biome lint .) began failing with 130 errors, 100% sourced from docs/product/07-praxis_workbench_prototype_v4.html — an untracked foreign draft from a parallel session, held behind a disclosed .git/info/exclude entry (git-level exclusion), which biome does not honor. One-line files.includes addition of '!!docs/product' keeps untracked foreign drafts out of project quality gates, consistent with the git-level exclusion; project files are unaffected (no committed file lives in docs/product)."
    - "requires_adr false: this task pins and documents laws docs/02 section 17 and ADR-0011 already declare; unless a cell exposes a genuine violation, no behavior changes at all — and a fix inside those documented laws is not an architecture decision. If evidence shows the fix needs a new event, port, or boundary, stop and amend this contract (that would be an ADR event)."
    - "contracts is forbidden: no new event vocabulary, no schema change, no envelope change — the matrix works entirely with existing facts; the migration seam from M5-T003 stays untouched."
    - "store-sqlite src is forbidden: the durability evidence uses openSessionStore as-is; if recovery evidence shows a store-level defect (e.g. prefix not surviving close), stop and amend the contract rather than patching the store inside this task."
    - "tests/helpers is forbidden: fault fixtures are local to the new suites (the existing suites build their own); testkit stays untouched."
    - Existing fault/recovery tests must not be weakened or deleted; the matrix is additive. Overlap with existing cells is acceptable (systematic walk vs incidental pins) but assertions must not contradict.
  architecture_refs: 
    - .praxis/architecture.yaml
    - docs/02-system-design.md
required_gates: 
  - unit
  - integration
  - replay
  - fault
  - store
  - build
acceptance: 
  scenarios: 
    - "crash at each docs/03 M5.3 boundary (before append / before execute / after side effect / before result append / after result append): the persisted prefix folds legally, resume appends the honest terminal fact, and the write tool's execute counter across crash+recovery+resume equals its pre-crash count"
    - "durable recovery: a SQLite store closed mid-execution and reopened from the same file recovers the identical persisted prefix and settles it via reconciliation with execute still called exactly once (docs/02 section 17 steps 1-4 and 6 across a real durability boundary)"
    - "the human loop: unresolved indeterminate pauses the session; PAUSED rejects runTurn; SessionResumed re-enters reconciliation; a settle on the retry continues the turn to completion without re-execution"
  failure_cases: 
    - a resume that re-executes a write tool which already crossed its side-effect boundary (counter > 1) — the core prohibition the matrix exists to catch
    - a dangling PROPOSED/AUTHORIZED execution silently dropped or coerced to failure instead of an explicit ToolRejected fact
    - a dangling EXECUTING execution coerced to FAILED or SUCCEEDED without a reconciliation fact
    - "non-idempotent recovery: a second resume appending another ToolRejected/ToolIndeterminate/ModelRequestFailed for an already-settled execution"
    - "a PAUSED session accepting a turn without SessionResumed, or a resumed session failing to re-attempt reconciliation"
    - recovery evidence that only holds in memory (prefix lost on close/reopen) — pinned by the SQLite durability test
  artifacts: 
    - tests/fault/crash-matrix.fault.test.ts
    - tests/store/crash-recovery.bun.test.ts
    - docs/02-system-design.md
    - docs/03-project-plan.md
    - docs/subsystems/core.md
    - docs/subsystems/store-sqlite.md
falsified_if: A matrix cell cannot be closed without weakening an existing fault/recovery test or without a core change that alters documented section 17 law; the SQLite close/reopen evidence cannot be produced with openSessionStore as-is; or the resume-retry loop (section 17 step 9) cannot be pinned without new event vocabulary.
requires_adr: false
requires_human_acceptance: true
notes: "Risk D per backlog (fault-injection over the agent loop's recovery paths; prerequisites M5-T002+M5-T003 satisfied). Reaches ACCEPTANCE_READY; human sign-off required. The preferred outcome is zero production-code change: every gate this task adds is a pin of law that already exists. M5-T005 (session fork, optional, risk C) remains; after it (or its explicit skip) M5 milestone acceptance with human demo."