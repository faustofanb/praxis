[settings]
lockfile = true

[tools]
bun = "1.3.14"

[tasks.install]
description = "Install exact-pinned workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.format]
run = "bun run format"

[tasks."format:check"]
run = "bun run format:check"

[tasks.lint]
run = "bun run lint"

[tasks.typecheck]
run = "bun run typecheck"

[tasks.test]
run = "bun run test"

# All current tests are unit-level; point this at a dedicated script when the
# integration/replay/fault suites split off in later milestones.
[tasks."test:unit"]
run = "bun run test"

[tasks."test:architecture"]
description = "Check import/dependency conformance against .praxis/architecture.yaml"
run = "bun scripts/ai/check-architecture.ts"

[tasks."test:integration"]
description = "Integration tests across core, contracts ports, and adapters"
run = "bun run test:integration"

[tasks."test:replay"]
description = "Replay laws: historical fixtures, restart determinism, checkpoint resumability"
run = "bun run test:replay"

[tasks."test:property"]
description = "Property-based tests (fast-check) over contracts and core laws"
run = "bun run test:property"

# Store tests exercise bun:sqlite and run under Bun's native test runner.
[tasks."test:store"]
description = "SQLite EventStore adapter tests under the Bun runtime"
run = "bun run test:store"

# CLI tests drive @praxis/cli (which pulls bun:sqlite transitively) under Bun.
[tasks."test:cli"]
description = "CLI composition-root tests under the Bun runtime"
run = "bun run test:cli"

# Fault injection: crashes and unknown-outcome paths around the tool runtime.
[tasks."test:fault"]
description = "Fault-injection tests over crash and indeterminate-outcome paths"
run = "bun run test:fault"

# Security: confinement and adversarial-input tests for tools and policies.
[tasks."test:security"]
description = "Security tests for path confinement and deny-by-default policy"
run = "bun run test:security"

# Real-model provider smoke (M2 real_model_eval). Non-blocking by design:
# skips with exit 0 when OPENAI_API_KEY is absent; never part of check.
[tasks."smoke:openai"]
description = "Non-blocking real-model smoke against the OpenAI-compatible endpoint"
run = "bun scripts/smoke/openai-smoke.ts"

[tasks."test:coverage"]
run = "bun run test:coverage"

# M0 build gate: the workspace compiles as one project graph. Diverge from
# typecheck once real package builds exist.
[tasks.build]
run = "bun run build"

[tasks.knip]
run = "bun run knip"

# AI development control plane (docs/06-ai-development-control-plane.md §5).
# ai:plan takes the Task Contract path: mise run ai:plan -- .praxis/tasks/<id>.yaml
[tasks."ai:status"]
run = "bun scripts/ai/praxis-dev.ts status"

[tasks."ai:brief"]
run = "bun scripts/ai/praxis-dev.ts brief"

[tasks."ai:plan"]
run = "bun scripts/ai/praxis-dev.ts plan"

[tasks."ai:guard"]
run = "bun scripts/ai/praxis-dev.ts guard"

[tasks."ai:verify"]
run = "bun scripts/ai/praxis-dev.ts verify"

[tasks."ai:accept"]
run = "bun scripts/ai/praxis-dev.ts accept"

[tasks."ai:handoff"]
run = "bun scripts/ai/praxis-dev.ts handoff"

[tasks.check]
depends = ["format:check", "lint", "typecheck", "test", "knip", "test:architecture"]

[tasks."check:all"]
depends = ["check", "test:coverage"]
