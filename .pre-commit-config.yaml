repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: praxis-commit-message
        name: Praxis提交信息门禁
        entry: uv run praxis gate commit-message --message-file
        language: system
        stages: [commit-msg]
